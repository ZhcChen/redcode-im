version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:17.6-alpine3.22
    container_name: redcode-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: redcode_im
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      TZ: Asia/Shanghai
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.redcode.service=postgres"
      - "com.redcode.description=PostgreSQL数据库"

  # Session 专用 Redis - 持久化模式
  redis-session:
    image: redis:8.2.2-alpine
    container_name: redcode-redis-session
    ports:
      - "6381:6381"
    volumes:
      - redis_session_data:/data
    command: |
      redis-server
      --port 6381
      --requirepass 123456
      --appendonly yes
      --aof-use-rdb-preamble yes
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory 128mb
      --maxmemory-policy volatile-lru
      --timeout 300
      --tcp-keepalive 60
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6381", "-a", "123456", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    environment:
      TZ: Asia/Shanghai
    labels:
      - "com.redcode.service=redis-session"
      - "com.redcode.description=Session专用Redis-持久化模式"

  # Streams 专用 Redis - 消息分发模式
  redis-streams:
    image: redis:8.2.2-alpine
    container_name: redcode-redis-streams
    ports:
      - "6382:6382"
    command: |
      redis-server
      --port 6382
      --requirepass 123456
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --timeout 300
      --tcp-keepalive 60
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6382", "-a", "123456", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    environment:
      TZ: Asia/Shanghai
    labels:
      - "com.redcode.service=redis-streams"
      - "com.redcode.description=Streams专用Redis-消息分发模式"

  # Cache 专用 Redis - 纯缓存模式
  redis-cache:
    image: redis:8.2.2-alpine
    container_name: redcode-redis-cache
    ports:
      - "6383:6383"
    command: |
      redis-server
      --port 6383
      --requirepass 123456
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save ""
      --timeout 300
      --tcp-keepalive 60
      --rdbcompression yes
      --active-defrag-threshold-lower 10
      --active-defrag-threshold-upper 100
      --active-defrag-cycle-min 25
      --active-defrag-cycle-max 75
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6383", "-a", "123456", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    environment:
      TZ: Asia/Shanghai
    labels:
      - "com.redcode.service=redis-cache"
      - "com.redcode.description=Cache专用Redis-纯缓存模式"

  # 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: redcode-backend
    ports:
      - "8080:8080"
    volumes:
      - ./.env:/app/.env:ro  # 挂载 .env 文件（只读）
      - ./src:/app/src        # 开发时挂载源码（可选）
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis-session:
        condition: service_healthy
      redis-streams:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "com.redcode.service=backend"
      - "com.redcode.description=Rust后端服务"

  # Redis 管理工具（可选）
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redcode-redis-commander
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: "session:redcode-redis-session:6381:0:123456,streams:redcode-redis-streams:6382:0:123456,cache:redcode-redis-cache:6383:0:123456"
      HTTP_USER: admin
      HTTP_PASSWORD: admin
    networks:
      - backend-network
    depends_on:
      - redis-session
      - redis-streams
      - redis-cache
    restart: unless-stopped
    profiles:
      - tools  # 使用 docker-compose --profile tools up 启动
    labels:
      - "com.redcode.service=redis-commander"
      - "com.redcode.description=Redis管理界面"

volumes:
  postgres_data:
    driver: local
    name: redcode_postgres_data
  redis_session_data:
    driver: local
    name: redcode_redis_session_data

networks:
  backend-network:
    driver: bridge
    name: redcode_backend_network
    ipam:
      config:
        - subnet: 172.21.0.0/16