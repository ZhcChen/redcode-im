syntax = "proto3";

package ws;

message ClientEvent {
  oneof payload {
    ClientAuth auth = 1;
    ClientJoin join = 2;
    ClientLeave leave = 3;
    ClientPing ping = 4;
  }
}

message ClientAuth {
  string token = 1;
}

message ClientJoin {
  string room_id = 1;
}

message ClientLeave {
  string room_id = 1;
}

message ClientPing {}

message ServerEvent {
  oneof payload {
    ServerAuthed authed = 1;
    ServerJoined joined = 2;
    ServerLeft left = 3;
    ServerMessage message = 4;
    ServerMessageRead message_read = 5;
    ServerMessageUpdate message_update = 6;
    ServerPinUpdate pin_update = 7;
    ServerError error = 8;
    ServerPong pong = 9;
    ServerFriendRequestUpdate friend_request_update = 10;
    ServerRoomCreated room_created = 11;
    ServerBanned user_banned = 12;
    ServerGroupDissolved group_dissolved = 13;
    ServerGroupOwnerTransferred group_owner_transferred = 14;
    ServerRoomUpdated room_updated = 15;
    ServerGroupSettingsUpdated group_settings_updated = 16;
    ServerGroupMemberChanged group_member_changed = 17;
    ServerFriendProfileUpdated friend_profile_updated = 18;
  }
}

message ServerAuthed {
  string user_id = 1;
  string conn_id = 2;
}

message ServerJoined {
  string room_id = 1;
}

message ServerLeft {
  string room_id = 1;
}

message ServerMessage {
  string id = 1;
  string message_id = 2;
  string room_id = 3;
  string sender_id = 4;
  string sender_username = 5;
  string sender_nickname = 6;
  string sender_avatar_url = 7;
  string content = 8;
  string message_type = 9;
  string timestamp = 10;
  QuotedMessage quoted_message = 11;
  ForwardMessage forward_message = 12;
  repeated MessagePart parts = 13;
}

message QuotedMessage {
  string id = 1;
  string room_id = 2;
  string sender_id = 3;
  string sender_username = 4;
  string sender_nickname = 5;
  string sender_avatar_url = 6;
  string content = 7;
  string message_type = 8;
  string created_at = 9;
  bool is_deleted = 10;
  repeated MessagePart parts = 11;
}

message ForwardMessage {
  string message_id = 1;
  string room_id = 2;
  string sender_id = 3;
  string sender_username = 4;
  string sender_nickname = 5;
}

message MessageAttachment {
  string key = 1;
  string name = 2;
  string mime = 3;
  int64 size = 4;
  int32 width = 5;
  int32 height = 6;
  int32 duration_ms = 7;
  string thumbnail_key = 8;
}

message MessagePart {
  int32 position = 1;
  string part_type = 2;
  string text = 3;
  MessageAttachment attachment = 4;
}

message ServerMessageRead {
  string room_id = 1;
  string message_id = 2;
  string reader_id = 3;
  string read_at = 4;
}

message ServerMessageUpdate {
  string room_id = 1;
  string message_id = 2;
  bool is_deleted = 3;
  string deleted_at = 4;
}

message ServerPinUpdate {
  string room_id = 1;
  string message_id = 2;
  bool is_pinned = 3;
  string pinned_at = 4;
  string pinned_by = 5;
}

message ServerError {
  string message = 1;
}

message ServerPong {}

message ServerFriendRequestUpdate {
  int32 pending_count = 1;
}

message ServerRoomCreated {
  string room_id = 1;
  string room_name = 2;
  string room_type = 3;
  string initiator_id = 4;
  string owner_id = 5;
  string description = 6;
  string avatar_url = 7;
  string created_at = 8;
}

message ServerBanned {
  string user_id = 1;
  string reason = 2;
}

message ServerGroupDissolved {
  string room_id = 1;
}

message ServerGroupOwnerTransferred {
  string room_id = 1;
  string old_owner_id = 2;
  string new_owner_id = 3;
}

message ServerGroupSettingsUpdated {
  string room_id = 1;
  bool global_mute_enabled = 2;
  optional string global_mute_reason = 3;
  optional string global_mute_until = 4;
  optional string global_mute_set_by = 5;
}

message ServerRoomUpdated {
  string room_id = 1;
  string room_name = 2;
  string room_type = 3;
  string avatar_url = 4;
  string avatar_object_key = 5;
  string description = 6;
}

// 群成员变更事件
// change_type: "role_changed" | "muted" | "unmuted" | "kicked" | "joined" | "left"
// new_role: "owner" | "admin" | "member" (仅 role_changed 时有效)
message ServerGroupMemberChanged {
  string room_id = 1;
  string member_id = 2;
  string change_type = 3;
  optional string new_role = 4;
  optional string operator_id = 5;
  optional string reason = 6;
  optional string until = 7;
}

// 好友资料更新事件（用于通知好友资料变化，如头像、昵称等）
message ServerFriendProfileUpdated {
  string user_id = 1;
  string username = 2;
  string nickname = 3;
  string avatar_url = 4;
  string avatar_object_key = 5;
}

enum PubSubPriority {
  PUBSUB_PRIORITY_UNKNOWN = 0;
  PUBSUB_PRIORITY_CRITICAL = 1;
  PUBSUB_PRIORITY_HIGH = 2;
  PUBSUB_PRIORITY_NORMAL = 3;
  PUBSUB_PRIORITY_LOW = 4;
}

message PubSubMessage {
  string id = 1;
  string room_id = 2;
  string sender_id = 3;
  string content = 4;
  string message_type = 5;
  PubSubPriority priority = 6;
  string timestamp = 7;
  string source_node = 8;
  repeated string target_nodes = 9;
  string sender_username = 10;
  string sender_nickname = 11;
  string sender_avatar_url = 12;
  QuotedMessage quoted_message = 13;
  ForwardMessage forward_message = 14;
  repeated MessagePart parts = 15;
}

message PubSubReadReceipt {
  string room_id = 1;
  string reader_id = 2;
  string message_id = 3;
  string read_at = 4;
  string source_node = 5;
}

message PubSubMessageUpdate {
  string room_id = 1;
  string message_id = 2;
  bool is_deleted = 3;
  string deleted_at = 4;
}

message PubSubPinUpdate {
  string room_id = 1;
  string message_id = 2;
  bool is_pinned = 3;
  string pinned_at = 4;
  string pinned_by = 5;
}

message PubSubRoomUpdate {
  string room_id = 1;
  string room_name = 2;
  string room_type = 3;
  string avatar_url = 4;
  string avatar_object_key = 5;
  string description = 6;
}

message PubSubGroupSettingsUpdate {
  string room_id = 1;
  bool global_mute_enabled = 2;
  optional string global_mute_reason = 3;
  optional string global_mute_until = 4;
  optional string global_mute_set_by = 5;
}

// 群成员变更事件（用于跨节点广播）
message PubSubGroupMemberChanged {
  string room_id = 1;
  string member_id = 2;
  string change_type = 3;
  optional string new_role = 4;
  optional string operator_id = 5;
  optional string reason = 6;
  optional string until = 7;
}

message PubSubEvent {
  oneof payload {
    PubSubMessage message = 1;
    PubSubReadReceipt read_receipt = 2;
    PubSubMessageUpdate message_update = 3;
    PubSubPinUpdate pin_update = 4;
    PubSubRoomUpdate room_update = 5;
    PubSubGroupSettingsUpdate group_settings_update = 6;
    PubSubGroupMemberChanged group_member_changed = 7;
  }
}
