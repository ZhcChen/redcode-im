version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:17.6-alpine3.22
    container_name: redcode-postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: redcode_im
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Session 专用 Redis
  redis-session:
    image: redis:8.2.2-alpine
    container_name: redcode-redis-session
    volumes:
      - redis_session_data:/data
    command: |
      redis-server
      --port 6381
      --requirepass ${REDIS_SESSION_PASSWORD}
      --appendonly yes
      --aof-use-rdb-preamble yes
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory 128mb
      --maxmemory-policy volatile-lru
      --timeout 300
      --tcp-keepalive 60
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6381", "-a", "${REDIS_SESSION_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Streams 专用 Redis
  redis-streams:
    image: redis:8.2.2-alpine
    container_name: redcode-redis-streams
    command: |
      redis-server
      --port 6382
      --requirepass ${REDIS_STREAM_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --timeout 300
      --tcp-keepalive 60
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6382", "-a", "${REDIS_STREAM_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Cache 专用 Redis
  redis-cache:
    image: redis:8.2.2-alpine
    container_name: redcode-redis-cache
    command: |
      redis-server
      --port 6383
      --requirepass ${REDIS_CACHE_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save ""
      --timeout 300
      --tcp-keepalive 60
      --rdbcompression yes
      --active-defrag-threshold-lower 10
      --active-defrag-threshold-upper 100
      --active-defrag-cycle-min 25
      --active-defrag-cycle-max 75
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6383", "-a", "${REDIS_CACHE_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 后端服务（生产环境）
  backend:
    image: redcode-im:latest  # 使用预构建的镜像
    container_name: redcode-backend
    ports:
      - "8010:8010"
      - "8011:8011"
    volumes:
      - ./.env:/app/.env:ro  # 挂载 .env 文件（只读）
      - ./api_doc:/app/api_doc:ro
    environment:
      - TZ=Asia/Shanghai
      - API_DOC_PORT=8011
    depends_on:
      postgres:
        condition: service_healthy
      redis-session:
        condition: service_healthy
      redis-streams:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

volumes:
  postgres_data:
    driver: local
    name: redcode_postgres_data
  redis_session_data:
    driver: local
    name: redcode_redis_session_data

networks:
  backend-network:
    driver: bridge
    name: redcode_backend_network
    ipam:
      config:
        - subnet: 172.21.0.0/16