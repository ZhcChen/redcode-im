 [package]
 name = "redcode-im-backend"
 version = "0.1.0"
 edition = "2021"

 [dependencies]
 axum = { version = "0.7", features = ["ws", "json"] }
 tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = "9.2"
bcrypt = "0.15"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["v4", "v7", "serde"] }
lazy_static = "1.4"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "macros", "migrate"], default-features = false }
dotenvy = "0.15"
redis = { version = "0.24", features = ["tokio-comp", "json", "streams", "cluster"] }
tokio-stream = "0.1"
futures-util = "0.3"
base64 = "0.22"
rand = "0.8"
prost = "0.12"
prost-types = "0.12"
bytes = "1.6"
reqwest = { version = "0.11", features = ["json", "multipart"] }
sha1 = "0.10"
hmac = "0.12"
hex = "0.4"
time = { version = "0.3", features = ["formatting", "parsing"] }
urlencoding = "2.1"
async-trait = "0.1"
regex = "1.10"

[build-dependencies]
prost-build = "0.12"
protoc-bin-vendored = "3"
