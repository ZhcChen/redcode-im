<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatly Updater</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: white;
            overflow: hidden;
        }

        .container {
            text-align: center;
            z-index: 1;
        }

        .title {
            font-size: 18px;
            font-weight: 300;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .subtitle {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 40px;
        }

        /* 雪花动画 */
        .snowflakes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .snowflake {
            position: absolute;
            color: white;
            font-size: 20px;
            user-select: none;
            animation: fall linear infinite;
        }

        .snowflake:nth-child(odd) {
            animation-duration: 10s;
            animation-delay: -5s;
        }

        .snowflake:nth-child(even) {
            animation-duration: 15s;
            animation-delay: -10s;
        }

        @keyframes fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* 生成雪花 */
        .snowflake:nth-child(1) { left: 10%; animation-delay: 0s; }
        .snowflake:nth-child(2) { left: 20%; animation-delay: -2s; }
        .snowflake:nth-child(3) { left: 30%; animation-delay: -4s; }
        .snowflake:nth-child(4) { left: 40%; animation-delay: -6s; }
        .snowflake:nth-child(5) { left: 50%; animation-delay: -8s; }
        .snowflake:nth-child(6) { left: 60%; animation-delay: -1s; }
        .snowflake:nth-child(7) { left: 70%; animation-delay: -3s; }
        .snowflake:nth-child(8) { left: 80%; animation-delay: -5s; }
        .snowflake:nth-child(9) { left: 90%; animation-delay: -7s; }
        .snowflake:nth-child(10) { left: 15%; animation-delay: -9s; }
        .snowflake:nth-child(11) { left: 25%; animation-delay: -2s; }
        .snowflake:nth-child(12) { left: 35%; animation-delay: -4s; }
        .snowflake:nth-child(13) { left: 45%; animation-delay: -6s; }
        .snowflake:nth-child(14) { left: 55%; animation-delay: -8s; }
        .snowflake:nth-child(15) { left: 65%; animation-delay: -1s; }
    </style>
</head>
<body>
    <div class="snowflakes">
        ❄❄❄❄❄❄❄❄❄❄❄❄❄❄❄
    </div>

    <div class="container">
        <div class="title">Chatly</div>
        <div class="subtitle">正在准备安装更新...</div>
    </div>

    <script>
        // 简单的加载动画，显示几秒后自动隐藏（由Rust代码控制窗口关闭）
        setTimeout(() => {
            document.querySelector('.subtitle').textContent = '安装程序启动中...';
        }, 500);
    </script>
</body>
</html>
