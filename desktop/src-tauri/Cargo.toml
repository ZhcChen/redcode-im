[package]
name = "redcode-im-desktop"
version = "1.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bear_chat_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
prost-build = "0.13"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "time", "sync", "macros", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
once_cell = "1.19"
reqwest = { version = "0.11", features = ["json", "stream", "multipart", "gzip", "brotli", "deflate", "rustls-tls"] }
thiserror = "1.0"
serde_urlencoded = "0.7"
base64 = "0.22"
bytes = "1"
prost = "0.13"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Backend 依赖
redcode-im-backend = { path = "../../backend" }

[dev-dependencies]
hyper = { version = "0.14", features = ["full"] }
