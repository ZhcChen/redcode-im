<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatly</title>
    <style>
      /* 预加载样式，减少 FOUC（无样式内容闪烁） */
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        background-color: #f5f5f5;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      #app {
        width: 100%;
        height: 100%;
      }

      /* 预加载动画，在 Vue 应用加载期间显示 */
      .app-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: min(400px, 100vw);
        height: min(600px, 100vh);
        background: url('/image/loading-bg.svg') no-repeat center center;
        background-size: cover;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      }

      .loading-title {
        width: 240px;
        height: 200px;
        object-fit: contain;
        margin-bottom: 48px;
      }

      .loading-text {
        font-size: 14px;
        color: #4ecdc4;
        letter-spacing: 1px;
        margin-bottom: 24px;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      }

      .loading-spinner {
        position: relative;
        width: 24px;
        height: 24px;
        animation: spin 1s linear infinite;
      }

      .loading-spinner .line {
        position: absolute;
        width: 2px;
        height: 6px;
        background: #4ecdc4;
        border-radius: 1px;
        top: 0;
        left: 50%;
        transform-origin: 1px 12px;
        margin-left: -1px;
        opacity: 0.3;
      }

      .loading-spinner .line:nth-child(1) { transform: rotate(0deg); animation: fade 1s linear infinite 0s; }
      .loading-spinner .line:nth-child(2) { transform: rotate(30deg); animation: fade 1s linear infinite 0.083s; }
      .loading-spinner .line:nth-child(3) { transform: rotate(60deg); animation: fade 1s linear infinite 0.166s; }
      .loading-spinner .line:nth-child(4) { transform: rotate(90deg); animation: fade 1s linear infinite 0.25s; }
      .loading-spinner .line:nth-child(5) { transform: rotate(120deg); animation: fade 1s linear infinite 0.333s; }
      .loading-spinner .line:nth-child(6) { transform: rotate(150deg); animation: fade 1s linear infinite 0.416s; }
      .loading-spinner .line:nth-child(7) { transform: rotate(180deg); animation: fade 1s linear infinite 0.5s; }
      .loading-spinner .line:nth-child(8) { transform: rotate(210deg); animation: fade 1s linear infinite 0.583s; }
      .loading-spinner .line:nth-child(9) { transform: rotate(240deg); animation: fade 1s linear infinite 0.666s; }
      .loading-spinner .line:nth-child(10) { transform: rotate(270deg); animation: fade 1s linear infinite 0.75s; }
      .loading-spinner .line:nth-child(11) { transform: rotate(300deg); animation: fade 1s linear infinite 0.833s; }
      .loading-spinner .line:nth-child(12) { transform: rotate(330deg); animation: fade 1s linear infinite 0.916s; }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes fade {
        0%, 100% {
          opacity: 0.3;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <div id="app">
      <!-- 预加载指示器 -->
      <div class="app-loading" id="app-loading">
        <img src="/image/icon-loading-title.svg" alt="Loading" class="loading-title" />
        <div class="loading-text">数据加载中...</div>
        <div class="loading-spinner">
          <div class="line"></div>
          <div class="line"></div>
          <div class="line"></div>
          <div class="line"></div>
          <div class="line"></div>
          <div class="line"></div>
          <div class="line"></div>
          <div class="line"></div>
          <div class="line"></div>
          <div class="line"></div>
          <div class="line"></div>
          <div class="line"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
