<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatly - 启动中</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: url('./image/loading-bg.svg') no-repeat center center;
            background-size: cover;
            height: 100vh;
            width: 100vw;
            position: relative;
            overflow: hidden;
        }
        
        .title-icon {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 240px;
            height: 200px;
        }
        
        .loading-text {
            position: absolute;
            bottom: 76px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: #4ECDC4; /* 主色调 */
            text-align: center;
        }
        
        .loading-spinner {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        
        .loading-spinner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .loading-spinner .line {
            position: absolute;
            width: 2px;
            height: 6px;
            background: #4ECDC4; /* 主色调 */
            border-radius: 1px;
            top: 0;
            left: 50%;
            transform-origin: 1px 12px;
            margin-left: -1px;
            opacity: 0.3;
        }
        
        .loading-spinner .line:nth-child(1) { transform: rotate(0deg); animation: fade 1s linear infinite 0s; }
        .loading-spinner .line:nth-child(2) { transform: rotate(30deg); animation: fade 1s linear infinite 0.083s; }
        .loading-spinner .line:nth-child(3) { transform: rotate(60deg); animation: fade 1s linear infinite 0.166s; }
        .loading-spinner .line:nth-child(4) { transform: rotate(90deg); animation: fade 1s linear infinite 0.25s; }
        .loading-spinner .line:nth-child(5) { transform: rotate(120deg); animation: fade 1s linear infinite 0.333s; }
        .loading-spinner .line:nth-child(6) { transform: rotate(150deg); animation: fade 1s linear infinite 0.416s; }
        .loading-spinner .line:nth-child(7) { transform: rotate(180deg); animation: fade 1s linear infinite 0.5s; }
        .loading-spinner .line:nth-child(8) { transform: rotate(210deg); animation: fade 1s linear infinite 0.583s; }
        .loading-spinner .line:nth-child(9) { transform: rotate(240deg); animation: fade 1s linear infinite 0.666s; }
        .loading-spinner .line:nth-child(10) { transform: rotate(270deg); animation: fade 1s linear infinite 0.75s; }
        .loading-spinner .line:nth-child(11) { transform: rotate(300deg); animation: fade 1s linear infinite 0.833s; }
        .loading-spinner .line:nth-child(12) { transform: rotate(330deg); animation: fade 1s linear infinite 0.916s; }
        
        @keyframes spin {
            to {
                transform: translateX(-50%) rotate(360deg);
            }
        }
        
        @keyframes fade {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <img src="./image/icon-loading-title.svg" alt="Loading" class="title-icon">
    <div class="loading-text">数据加载中...</div>
    <div class="loading-spinner">
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
    </div>
    
    <script>
        // 监听资源加载完成
        window.addEventListener('DOMContentLoaded', () => {
            // 预加载背景图片
            const bgImg = new Image();
            bgImg.src = './image/loading-bg.svg';
            
            const showWindow = () => {
                // 通知 Rust 已经准备就绪，可以显示窗口了
                if (window.__TAURI__ && window.__TAURI__.core) {
                    window.__TAURI__.core.invoke('splashscreen_ready')
                        .catch(console.error);
                }
            };

            bgImg.onload = showWindow;
            bgImg.onerror = showWindow; // 即使图片加载失败也显示窗口
            
            // 防止图片已经缓存导致不触发onload
            if (bgImg.complete) {
                showWindow();
            }
        });
    </script>
</body>
</html>
