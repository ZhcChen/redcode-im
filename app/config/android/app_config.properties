# Android 构建基础配置（示例）
#
# 注意：
# - 此文件中的值为示例占位，请根据实际项目环境修改
# - 生产环境的 keystore 文件和真实密码请不要提交到代码仓库
# - 如需为不同环境设置不同包名，可通过 applicationIdSuffix 等方式扩展

# 应用基础包名（Application ID）
APPLICATION_ID=com.chatlyme.app

# 可选：不同环境的包名后缀（未在当前 Gradle 脚本中启用，仅预留）
# APPLICATION_ID_SUFFIX_DEVELOPMENT=.dev
# APPLICATION_ID_SUFFIX_STAGING=.staging

# keystore 配置（示例值，仅用于说明字段含义）
# 实际使用时建议在本地创建 app_config.local.properties 覆盖这些值，
# 或使用环境变量/CI Secret 注入，避免泄露敏感信息。
# KEYSTORE_FILE=keystore/release.keystore
# KEYSTORE_PASSWORD=change_me_keystore_password
# KEY_ALIAS=release
# KEY_PASSWORD=change_me_key_password
