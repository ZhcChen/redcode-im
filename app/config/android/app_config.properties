# Android 构建基础配置
#
# 注意：
# - 当前仓库默认直接提供 Android release 签名所需配置，供本地与 CI 统一使用
# - 如需本地覆盖，可创建 app_config.local.properties 并在 Gradle 中优先读取
# - 如需为不同环境设置不同包名，可通过 applicationIdSuffix 等方式扩展

# 应用基础包名（Application ID）
APPLICATION_ID=com.chatlyme.app

# 可选：不同环境的包名后缀（未在当前 Gradle 脚本中启用，仅预留）
# APPLICATION_ID_SUFFIX_DEVELOPMENT=.dev
# APPLICATION_ID_SUFFIX_STAGING=.staging

# keystore 配置
KEYSTORE_FILE=../config/android/keystore/release.jks
KEYSTORE_PASSWORD=123456
KEY_ALIAS=release
KEY_PASSWORD=123456
