name: Build Release Artifacts

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish artifacts to a GitHub release"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Release tag used only when publish_release is true"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-release-artifacts-${{ inputs.release_tag || github.ref_name || github.sha }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.11"
  NODE_VERSION: "24"
  H5_RUST_VERSION: "1.94.0"

jobs:
  validate-release-inputs:
    name: Validate release inputs
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          PUBLISH_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release || false }}
        run: scripts/release/validate-release-inputs.sh

  supply-chain-check:
    name: Supply-chain release gate
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify fail-closed fixtures
        run: make supply-chain.test

      - name: Scan six locked dependency sets
        run: make supply-chain.check

      - name: Validate machine reports
        run: |
          set -euo pipefail
          jq -e '
            .verdict == "pass" and
            .commit == $commit and
            (.modules | length == 6) and
            (.blocking_findings | length == 0)
          ' --arg commit "$GITHUB_SHA" .artifacts/supply-chain/summary.json >/dev/null
          jq -e '
            .commit == $commit and
            .summary.commit == $commit and
            .summary.verdict == "pass"
          ' --arg commit "$GITHUB_SHA" .artifacts/supply-chain/index.json >/dev/null
          test "$(find .artifacts/supply-chain/reports -type f -name "*.json" | wc -l)" -eq 6
          test "$(find .artifacts/supply-chain/sbom -type f -name "*.cdx.json" | wc -l)" -eq 6

      - name: Upload supply-chain evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: supply-chain-release-${{ github.sha }}
          path: .artifacts/supply-chain/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  android-app-check:
    name: Build Android app (Kotlin/Compose)
    needs:
      - validate-release-inputs
      - supply-chain-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Build E2EE host library
        working-directory: ${{ github.workspace }}
        run: cargo build --locked --manifest-path e2ee-core/Cargo.toml --release

      - name: Run unit tests
        env:
          E2EE_CORE_LIB_DIR: ${{ github.workspace }}/e2ee-core/target/release
        run: ./gradlew testDebugUnitTest

      - name: Run Android Lint
        run: ./gradlew lintRelease

      - name: Build Android release candidate
        env:
          PUBLISH_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release || false }}
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          SIGNING_MODE="$($GITHUB_WORKSPACE/scripts/release/validate-android-signing.sh)"
          OUT="$GITHUB_WORKSPACE/.artifacts/android"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -mindepth 2 -maxdepth 2 -name apksigner -type f -print | sort -V | tail -1)"
          test -n "$APKSIGNER" || { echo "Android SDK apksigner is required" >&2; exit 1; }
          mkdir -p "$OUT"

          if [ "$SIGNING_MODE" = "signed" ]; then
            KEYSTORE="$RUNNER_TEMP/redcode-im-release.keystore"
            trap 'rm -f "$KEYSTORE"' EXIT
            printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            keytool -list -keystore "$KEYSTORE" \
              -storepass:env ANDROID_SIGNING_STORE_PASSWORD \
              -alias "$ANDROID_SIGNING_KEY_ALIAS" >/dev/null
            ./gradlew assembleRelease \
              -Predcode.signing.storeFile="$KEYSTORE" \
              -Predcode.signing.storePassword="$ANDROID_SIGNING_STORE_PASSWORD" \
              -Predcode.signing.keyAlias="$ANDROID_SIGNING_KEY_ALIAS" \
              -Predcode.signing.keyPassword="$ANDROID_SIGNING_KEY_PASSWORD"
            SOURCE="app/build/outputs/apk/release/app-release.apk"
            "$APKSIGNER" verify "$SOURCE"
          else
            ./gradlew assembleRelease
            SOURCE="app/build/outputs/apk/release/app-release-unsigned.apk"
            if "$APKSIGNER" verify "$SOURCE" >/dev/null 2>&1; then
              echo "验收 candidate 不得携带发布签名" >&2
              exit 1
            fi
          fi

          cp "$SOURCE" "$OUT/redcode-im-android-${GITHUB_SHA}.apk"

      - name: Attest Android release candidate provenance
        uses: actions/attest-build-provenance@78e6cbd37d0ac1a40113c04f2037dacf1ea3f12e # v4
        with:
          subject-path: .artifacts/android/redcode-im-android-${{ github.sha }}.apk

      - name: Upload Android release candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-app-release
          path: .artifacts/android/redcode-im-android-${{ github.sha }}.apk
          if-no-files-found: error
          include-hidden-files: true

  ios-app-check:
    if: false # macOS runner 构建资源与签名配置暂未就绪，仅保留定义便于后续恢复
    name: Build iOS app (Swift/SwiftUI)
    needs:
      - validate-release-inputs
      - supply-chain-check
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios-app
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run SwiftPM tests
        run: swift test

      - name: Build simulator app
        run: xcodebuild -project RedCodeIM.xcodeproj -target RedCodeIM -configuration Debug -sdk iphonesimulator build

  api-check:
    name: API test
    needs:
      - validate-release-inputs
      - supply-chain-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run API tests in Compose
        run: make api.test

  api-build:
    name: Build API ${{ matrix.arch }}
    needs:
      - api-check
      - supply-chain-check
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build API Docker image
        run: |
          set -euo pipefail
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --load \
            --tag "redcode-im-api:${{ github.sha }}-${{ matrix.arch }}" \
            --file api/docker/release/Dockerfile \
            api

      - name: Export API image and binary
        env:
          API_RELEASE_IMAGE: redcode-im-api:${{ github.sha }}-${{ matrix.arch }}
          API_RELEASE_ARCH: ${{ matrix.arch }}
          API_RELEASE_OUT: ${{ github.workspace }}/.artifacts/api
        run: |
          set -euo pipefail
          scripts/release/export-api-artifacts.sh

      - name: Attest API artifacts provenance
        uses: actions/attest-build-provenance@78e6cbd37d0ac1a40113c04f2037dacf1ea3f12e # v4
        with:
          subject-path: .artifacts/api/*

      - name: Upload API artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: api-linux-${{ matrix.arch }}-release
          path: .artifacts/api/*
          if-no-files-found: error
          include-hidden-files: true

  h5-app-build:
    name: Build and attest H5 candidate
    needs:
      - validate-release-inputs
      - supply-chain-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      H5_RELEASE_API_BASE_URL: ${{ vars.H5_RELEASE_API_BASE_URL }}
      H5_RELEASE_WS_URL: ${{ vars.H5_RELEASE_WS_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Validate H5 release endpoints
        run: |
          set -euo pipefail
          test -n "$H5_RELEASE_API_BASE_URL" || { echo "H5_RELEASE_API_BASE_URL repository variable is required" >&2; exit 1; }
          test -n "$H5_RELEASE_WS_URL" || { echo "H5_RELEASE_WS_URL repository variable is required" >&2; exit 1; }

      - name: Setup pinned H5 Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$H5_RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$H5_RUST_VERSION"
          test "$(rustc --version | awk '{print $2}')" = "$H5_RUST_VERSION"

      - name: Install pinned wasm-pack
        run: cargo install wasm-pack --locked --version 0.15.0

      - name: Install H5 dependencies
        working-directory: h5-app
        run: bun install --frozen-lockfile

      - name: Build and verify H5 candidate
        run: |
          set -euo pipefail
          make e2ee-core.build.h5
          make h5-app.release.build \
            H5_RELEASE_API_BASE_URL="$H5_RELEASE_API_BASE_URL" \
            H5_RELEASE_WS_URL="$H5_RELEASE_WS_URL"

      - name: Package H5 candidate
        run: |
          set -euo pipefail
          OUT=".artifacts/h5-release"
          ARCHIVE="$OUT/redcode-im-h5-${GITHUB_SHA}.tar.gz"
          tar -C h5-app -czf "$ARCHIVE" dist
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          test -f "$OUT/${GITHUB_SHA}.json"

      - name: Attest H5 candidate provenance
        uses: actions/attest-build-provenance@78e6cbd37d0ac1a40113c04f2037dacf1ea3f12e # v4
        with:
          subject-path: .artifacts/h5-release/redcode-im-h5-${{ github.sha }}.tar.gz

      - name: Upload H5 candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: h5-app-release
          path: .artifacts/h5-release/*
          if-no-files-found: error
          include-hidden-files: true

  desktop-check:
    if: false # 暂时停用 desktop release 检查，仅保留定义便于后续恢复
    name: Desktop check
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install desktop dependencies
        run: bun install --frozen-lockfile

      - name: Type check desktop
        run: bun run type-check

      - name: Run desktop tests
        run: bun run test

  desktop-build:
    if: false # 暂时停用 desktop release 构建，仅保留定义便于后续恢复
    name: Build desktop ${{ matrix.name }} ${{ matrix.arch }}
    needs: desktop-check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            arch: arm64
            slug: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: macOS
            arch: x86_64
            slug: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: Windows
            arch: x86_64
            slug: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux
            arch: x86_64
            slug: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: Linux
            arch: arm64
            slug: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libasound2-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev pkg-config protobuf-compiler librsvg2-dev patchelf xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install protoc on macOS
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc on Windows
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install desktop dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Tauri sidecars
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          case "$TARGET" in
            *windows*) EXE=".exe" ;;
            *) EXE="" ;;
          esac

          mkdir -p src-tauri/resources src-tauri/binaries

          UPDATER="src-tauri/resources/updater-${TARGET}${EXE}"
          if [ ! -f "$UPDATER" ]; then
            touch "$UPDATER"
            if [ -z "$EXE" ]; then
              chmod +x "$UPDATER"
            fi
          fi

          FFMPEG="src-tauri/binaries/ffmpeg-${TARGET}${EXE}"
          CREATED_FFMPEG_PLACEHOLDER=false
          if [ ! -f "$FFMPEG" ]; then
            CREATED_FFMPEG_PLACEHOLDER=true
            if [ -n "$EXE" ]; then
              touch "$FFMPEG"
            else
              printf '#!/usr/bin/env sh\nexit 69\n' > "$FFMPEG"
              chmod +x "$FFMPEG"
            fi
          fi

          (
            cd src-tauri
            cargo build --release --bin updater --target "$TARGET"
          )

          cp "src-tauri/target/${TARGET}/release/updater${EXE}" "$UPDATER"
          if [ "$CREATED_FFMPEG_PLACEHOLDER" = true ] && [ -n "$EXE" ]; then
            cp "$UPDATER" "$FFMPEG"
          fi

      - name: Build Tauri package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          if [ "$TARGET" = "x86_64-pc-windows-msvc" ]; then
            bunx tauri build --target "$TARGET" --config src-tauri/tauri.windows.ci.conf.json
          else
            bunx tauri build --target "$TARGET"
          fi

      - name: Collect desktop artifacts
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          OUT="../.artifacts/desktop/${SLUG}"
          BUNDLE_DIR="src-tauri/target/${TARGET}/release/bundle"
          mkdir -p "$OUT"

          find "$BUNDLE_DIR" -type f \( \
            -name "*.AppImage" -o \
            -name "*.deb" -o \
            -name "*.dmg" -o \
            -name "*.exe" -o \
            -name "*.msi" -o \
            -name "*.rpm" -o \
            -name "*.tar.gz" -o \
            -name "*.zip" \
          \) -print0 | while IFS= read -r -d '' file; do
            cp "$file" "$OUT/redcode-im-desktop-${SLUG}-$(basename "$file")"
          done

          test -n "$(find "$OUT" -type f -print -quit)"

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-${{ matrix.slug }}-release
          path: .artifacts/desktop/${{ matrix.slug }}/*
          if-no-files-found: error
          include-hidden-files: true

  publish-release:
    name: Publish GitHub release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
    needs:
      - validate-release-inputs
      - supply-chain-check
      - android-app-check
      - api-build
      - h5-app-build
      # - desktop-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Download Android artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: android-app-release
          path: .artifacts/downloaded

      - name: Download API artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: api-linux-*-release
          path: .artifacts/downloaded
          merge-multiple: true

      - name: Download H5 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: h5-app-release
          path: .artifacts/downloaded

      - name: Export release tag
        env:
          RESOLVED_RELEASE_TAG: ${{ needs.validate-release-inputs.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -z "$RESOLVED_RELEASE_TAG" ]; then
            echo "Resolved release tag is empty" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$RESOLVED_RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Verify release tag source commit
        run: |
          set -euo pipefail
          git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null || {
            echo "Release tag ${RELEASE_TAG} must already exist" >&2
            exit 1
          }
          TAG_COMMIT="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
            echo "Release tag ${RELEASE_TAG} points to ${TAG_COMMIT}, expected ${GITHUB_SHA}" >&2
            exit 1
          fi

      - name: Flatten release assets
        run: |
          set -euo pipefail
          mkdir -p .artifacts/publish-assets
          find .artifacts/downloaded -type f -print0 | while IFS= read -r -d '' file; do
            cp "$file" ".artifacts/publish-assets/$(basename "$file")"
          done

      - name: Generate release notes
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash .github/scripts/generate-release-notes.sh \
            "${RELEASE_TAG}" \
            "${GITHUB_REPOSITORY}" \
            .artifacts/publish-assets \
            .artifacts/release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSETS_DIR: ${{ github.workspace }}/.artifacts/publish-assets
          RELEASE_NOTES_FILE: ${{ github.workspace }}/.artifacts/release-notes.md
        run: scripts/release/create-github-release.sh
