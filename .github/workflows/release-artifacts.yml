name: Build Release Artifacts

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish artifacts to a GitHub release"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Release tag used only when publish_release is true"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-release-artifacts-${{ github.ref_name }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.11"
  FLUTTER_VERSION: "3.41.5"
  NODE_VERSION: "24"

jobs:
  validate-release-inputs:
    name: Validate release inputs
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - name: Resolve release tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail

          RELEASE_TAG=""
          if [ "$EVENT_NAME" = "push" ]; then
            RELEASE_TAG="$REF_NAME"
          elif [ "$PUBLISH_RELEASE" = "true" ]; then
            if [ -z "$INPUT_RELEASE_TAG" ]; then
              echo "release_tag is required when publish_release=true" >&2
              exit 1
            fi
            RELEASE_TAG="$INPUT_RELEASE_TAG"
          elif [ -n "$INPUT_RELEASE_TAG" ]; then
            RELEASE_TAG="$INPUT_RELEASE_TAG"
          fi

          if [ -n "$RELEASE_TAG" ] && [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  app-check:
    name: Flutter app check
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter app
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

  app-build:
    name: Build Flutter app ${{ matrix.name }}
    needs: app-check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            target: android
            runner: ubuntu-latest
          - name: iOS unsigned
            target: ios
            runner: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        if: matrix.target == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Android APK and AAB
        if: matrix.target == 'android'
        run: |
          set -euo pipefail
          flutter build apk --release --dart-define=ENV=production
          flutter build appbundle --release --dart-define=ENV=production

          mkdir -p ../.artifacts/app/android
          cp build/app/outputs/flutter-apk/app-release.apk ../.artifacts/app/android/redcode-im-app-android-release.apk
          cp build/app/outputs/bundle/release/app-release.aab ../.artifacts/app/android/redcode-im-app-android-release.aab

      - name: Build unsigned iOS IPA
        if: matrix.target == 'ios'
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --dart-define=ENV=production

          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload ../.artifacts/app/ios
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          (
            cd build/ios/ipa
            zip -qry redcode-im-app-ios-nosign.ipa Payload
          )
          cp build/ios/ipa/redcode-im-app-ios-nosign.ipa ../.artifacts/app/ios/

      - name: Upload Flutter app artifacts
        uses: actions/upload-artifact@v6
        with:
          name: app-${{ matrix.target }}-release
          path: .artifacts/app/${{ matrix.target }}/*
          if-no-files-found: error
          include-hidden-files: true

  api-check:
    name: API test
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run API tests in Compose
        run: make api.test

  api-build:
    name: Build API ${{ matrix.arch }}
    needs: api-check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        run: |
          set -euo pipefail
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --load \
            --tag "redcode-im-api:${{ github.sha }}-${{ matrix.arch }}" \
            --file api/docker/release/Dockerfile \
            api

      - name: Export API image and binary
        run: |
          set -euo pipefail
          mkdir -p .artifacts/api

          IMAGE="redcode-im-api:${{ github.sha }}-${{ matrix.arch }}"
          CONTAINER_ID="$(docker create "$IMAGE")"
          docker cp "$CONTAINER_ID:/app/redcode-im-api" ".artifacts/api/redcode-im-api-linux-${{ matrix.arch }}"
          docker rm "$CONTAINER_ID"
          chmod +x ".artifacts/api/redcode-im-api-linux-${{ matrix.arch }}"

          tar -C .artifacts/api -czf ".artifacts/api/redcode-im-api-linux-${{ matrix.arch }}.binary.tar.gz" "redcode-im-api-linux-${{ matrix.arch }}"
          docker save "$IMAGE" -o ".artifacts/api/redcode-im-api-linux-${{ matrix.arch }}.docker.tar"
          gzip -9 ".artifacts/api/redcode-im-api-linux-${{ matrix.arch }}.docker.tar"

          (
            cd .artifacts/api
            sha256sum "redcode-im-api-linux-${{ matrix.arch }}.binary.tar.gz" "redcode-im-api-linux-${{ matrix.arch }}.docker.tar.gz" > "redcode-im-api-linux-${{ matrix.arch }}.sha256"
          )

      - name: Upload API artifacts
        uses: actions/upload-artifact@v6
        with:
          name: api-linux-${{ matrix.arch }}-release
          path: .artifacts/api/*
          if-no-files-found: error
          include-hidden-files: true

  desktop-check:
    name: Desktop check
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install desktop dependencies
        run: bun install --frozen-lockfile

      - name: Type check desktop
        run: bun run type-check

      - name: Run desktop tests
        run: bun run test

  desktop-build:
    name: Build desktop ${{ matrix.name }} ${{ matrix.arch }}
    needs: desktop-check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            arch: arm64
            slug: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: macOS
            arch: x86_64
            slug: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: Windows
            arch: x86_64
            slug: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Windows
            arch: arm64
            slug: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - name: Linux
            arch: x86_64
            slug: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: Linux
            arch: arm64
            slug: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libasound2-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev pkg-config protobuf-compiler librsvg2-dev patchelf xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup protoc
        uses: arduino/setup-protoc@v3

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install desktop dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Tauri sidecars
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          case "$TARGET" in
            *windows*) EXE=".exe" ;;
            *) EXE="" ;;
          esac

          mkdir -p src-tauri/resources src-tauri/binaries

          UPDATER="src-tauri/resources/updater-${TARGET}${EXE}"
          if [ ! -f "$UPDATER" ]; then
            touch "$UPDATER"
            if [ -z "$EXE" ]; then
              chmod +x "$UPDATER"
            fi
          fi

          FFMPEG="src-tauri/binaries/ffmpeg-${TARGET}${EXE}"
          CREATED_FFMPEG_PLACEHOLDER=false
          if [ ! -f "$FFMPEG" ]; then
            CREATED_FFMPEG_PLACEHOLDER=true
            if [ -n "$EXE" ]; then
              touch "$FFMPEG"
            else
              printf '#!/usr/bin/env sh\nexit 69\n' > "$FFMPEG"
              chmod +x "$FFMPEG"
            fi
          fi

          (
            cd src-tauri
            cargo build --release --bin updater --target "$TARGET"
          )

          cp "src-tauri/target/${TARGET}/release/updater${EXE}" "$UPDATER"
          if [ "$CREATED_FFMPEG_PLACEHOLDER" = true ] && [ -n "$EXE" ]; then
            cp "$UPDATER" "$FFMPEG"
          fi

      - name: Build Tauri package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: bunx tauri build --target "$TARGET"

      - name: Collect desktop artifacts
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          OUT="../.artifacts/desktop/${SLUG}"
          BUNDLE_DIR="src-tauri/target/${TARGET}/release/bundle"
          mkdir -p "$OUT"

          find "$BUNDLE_DIR" -type f \( \
            -name "*.AppImage" -o \
            -name "*.deb" -o \
            -name "*.dmg" -o \
            -name "*.exe" -o \
            -name "*.msi" -o \
            -name "*.rpm" -o \
            -name "*.tar.gz" -o \
            -name "*.zip" \
          \) -print0 | while IFS= read -r -d '' file; do
            cp "$file" "$OUT/redcode-im-desktop-${SLUG}-$(basename "$file")"
          done

          test -n "$(find "$OUT" -type f -print -quit)"

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.slug }}-release
          path: .artifacts/desktop/${{ matrix.slug }}/*
          if-no-files-found: error
          include-hidden-files: true

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    needs:
      - validate-release-inputs
      - app-build
      - api-build
      - desktop-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          path: .artifacts/downloaded

      - name: Export release tag
        env:
          RESOLVED_RELEASE_TAG: ${{ needs.validate-release-inputs.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -z "$RESOLVED_RELEASE_TAG" ]; then
            echo "Resolved release tag is empty" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$RESOLVED_RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Flatten release assets
        run: |
          set -euo pipefail
          mkdir -p .artifacts/publish-assets
          find .artifacts/downloaded -type f -print0 | while IFS= read -r -d '' file; do
            cp "$file" ".artifacts/publish-assets/$(basename "$file")"
          done

      - name: Generate release notes
        run: |
          set -euo pipefail
          {
            echo "# RedCode IM ${RELEASE_TAG}"
            echo
            echo "## Artifacts"
            find .artifacts/publish-assets -type f -printf "- %f\n" | sort
          } > .artifacts/release-notes.md

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${RELEASE_TAG}" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          else
            PRERELEASE_FLAG=""
          fi

          if gh release view "${RELEASE_TAG}" > /dev/null 2>&1; then
            mapfile -t EXISTING_ASSETS < <(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')

            for ASSET_NAME in "${EXISTING_ASSETS[@]}"; do
              gh release delete-asset "${RELEASE_TAG}" "${ASSET_NAME}" --yes
            done

            gh release upload "${RELEASE_TAG}" .artifacts/publish-assets/* --clobber
            gh release edit "${RELEASE_TAG}" \
              --title "RedCode IM ${RELEASE_TAG}" \
              --notes-file .artifacts/release-notes.md \
              ${PRERELEASE_FLAG}
          else
            gh release create "${RELEASE_TAG}" .artifacts/publish-assets/* \
              --title "RedCode IM ${RELEASE_TAG}" \
              --notes-file .artifacts/release-notes.md \
              ${PRERELEASE_FLAG}
          fi
