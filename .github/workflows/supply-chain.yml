name: Supply Chain Gate

on:
  pull_request_target:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.11"
  SOURCE_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
  SOURCE_REPOSITORY: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name || github.repository }}

jobs:
  supply-chain-check:
    name: Scan locked dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted gate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          path: .supply-chain-gate

      - name: Checkout untrusted source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          path: .supply-chain-source
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify fail-closed fixtures
        run: make -C .supply-chain-gate supply-chain.test

      - name: Scan six locked dependency sets
        env:
          SUPPLY_CHAIN_SOURCE_ROOT: ${{ github.workspace }}/.supply-chain-source
          SUPPLY_CHAIN_OUTPUT_DIR: ${{ github.workspace }}/.artifacts/supply-chain
        run: .supply-chain-gate/scripts/supply-chain/check.sh

      - name: Validate machine reports
        run: |
          set -euo pipefail
          jq -e '
            .verdict == "pass" and
            .commit == $commit and
            (.modules | length == 6) and
            (.blocking_findings | length == 0)
          ' --arg commit "$SOURCE_SHA" .artifacts/supply-chain/summary.json >/dev/null
          jq -e '
            .commit == $commit and
            .summary.commit == $commit and
            .summary.verdict == "pass"
          ' --arg commit "$SOURCE_SHA" .artifacts/supply-chain/index.json >/dev/null
          test "$(find .artifacts/supply-chain/reports -type f -name "*.json" | wc -l)" -eq 6
          test "$(find .artifacts/supply-chain/sbom -type f -name "*.cdx.json" | wc -l)" -eq 6

      - name: Upload supply-chain evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: supply-chain-${{ env.SOURCE_SHA }}
          path: .artifacts/supply-chain/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
