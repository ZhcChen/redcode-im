name: Supply Chain Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.11"

jobs:
  supply-chain-check:
    name: Scan locked dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify fail-closed fixtures
        run: make supply-chain.test

      - name: Scan six locked dependency sets
        run: make supply-chain.check

      - name: Validate machine reports
        run: |
          set -euo pipefail
          jq -e '
            .verdict == "pass" and
            (.modules | length == 6) and
            (.blocking_findings | length == 0)
          ' .artifacts/supply-chain/summary.json >/dev/null
          test "$(find .artifacts/supply-chain/reports -type f -name "*.json" | wc -l)" -eq 6
          test "$(find .artifacts/supply-chain/sbom -type f -name "*.cdx.json" | wc -l)" -eq 6

      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: supply-chain-${{ github.sha }}
          path: .artifacts/supply-chain/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
