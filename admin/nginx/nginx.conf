server {
    listen 80;
    server_name admin.chatlyme.com;

    # 静态文件根目录
    root /home/ubuntu/admin;
    index index.html;

    # 调试：所有响应添加 Host 头信息
    add_header X-Debug-Host $host always;
    add_header X-Debug-Server-Name $server_name always;

    # 开启 gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # 静态资源缓存配置
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;  # 如果文件不存在,返回 404 而不是继续匹配
        expires 30d;
        add_header Cache-Control "public, immutable";
        # 临时开启访问日志用于调试
        # access_log off;
    }

    # HTML 文件不缓存
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 调试端点 - 查看请求信息
    location /debug-headers {
        return 200 "Host: $host\nServer Name: $server_name\nRequest URI: $request_uri\nRemote Addr: $remote_addr\n";
        add_header Content-Type text/plain;
    }

    # SPA 路由支持 - 只对非静态资源的请求返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理配置(如果需要代理后端 API)
    # location /api/ {
    #     proxy_pass http://backend:8080;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # 错误页面 - 只对非静态资源的 404 返回 index.html (通过 location / 的 try_files 处理)
    # 静态资源(js/css等)的 404 直接返回 404,不重定向到 index.html
    error_page 500 502 503 504 /50x.html;
}
