version: '3.8'

services:
  # PostgreSQL数据库
  postgres:
    image: postgres:17.6-alpine3.22
    container_name: redcode-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: redcode_im
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      TZ: Asia/Shanghai
    networks:
      - redcode-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Session专用Redis - 持久化模式
  redis-session:
    image: redis:8.2.2-alpine
    container_name: redcode-redis-session
    ports:
      - "6381:6379"
    volumes:
      - redis_session_data:/data
    command: |
      redis-server
      --requirepass redis_session_password
      --appendonly yes
      --aof-use-rdb-preamble yes
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
      --timeout 300
      --tcp-keepalive 60
      --notify-keyspace-events Ex
    networks:
      - redcode-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Stream专用Redis - 高性能模式
  redis-stream:
    image: redis:8.2.2-alpine
    container_name: redcode-redis-stream
    ports:
      - "6382:6379"
    volumes:
      - redis_stream_data:/data
    command: |
      redis-server
      --requirepass redis_stream_password
      --appendonly no
      --save ""
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --timeout 0
      --tcp-keepalive 60
      --stream-node-max-entries 100
    networks:
      - redcode-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache专用Redis - 纯缓存模式
  redis-cache:
    image: redis:8.2.2-alpine
    container_name: redcode-redis-cache
    ports:
      - "6383:6379"
    command: |
      redis-server
      --requirepass redis_cache_password
      --appendonly no
      --save ""
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --timeout 0
      --tcp-keepalive 60
      --lfu-decay-time 1
    networks:
      - redcode-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO 对象存储服务
  minio:
    image: minio/minio:latest
    container_name: redcode-minio
    restart: unless-stopped
    ports:
      - "9000:9000"     # API端口
      - "9001:9001"     # 控制台端口
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123456
      MINIO_REGION_NAME: us-east-1
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    volumes:
      - minio_data:/data
      - minio_config:/root/.minio
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - redcode-network

  # MinIO 初始化
  minio-init:
    image: minio/mc:latest
    container_name: redcode-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 admin admin123456;
      mc mb local/avatars --ignore-existing;
      mc mb local/chat-files --ignore-existing;
      mc mb local/chat-images --ignore-existing;
      mc mb local/chat-videos --ignore-existing;
      mc mb local/chat-voices --ignore-existing;
      mc anonymous set download local/avatars;
      mc anonymous set download local/chat-images;
      echo 'MinIO initialization complete!';
      exit 0;
      "
    networks:
      - redcode-network

  # Adminer 数据库管理工具（可选）
  adminer:
    image: adminer:latest
    container_name: redcode-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - redcode-network
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_session_data:
  redis_stream_data:
  minio_data:
  minio_config:

networks:
  redcode-network:
    driver: bridge
