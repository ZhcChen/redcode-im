# 本地开发环境 - 源码运行（容器内 cargo run）
# 用法: docker compose -f api/docker/dev/docker-compose.yml up -d

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:17-alpine
    container_name: redcode-dev-postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: redcode_im
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      TZ: Asia/Shanghai
    networks:
      - dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis（session / pubsub / cache 三个逻辑入口共用）
  redis:
    image: redis:7-alpine
    container_name: redcode-dev-redis
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --port 6379
      --requirepass 123456
      --appendonly yes
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory 128mb
      --maxmemory-policy volatile-lru
    networks:
      - dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # 外部依赖 Mock（S3-compatible、FCM、APNs、IPInfo），本地联调不访问线上对象存储/推送服务
  external-mock:
    build:
      context: ../../../tests/mocks/external
      dockerfile: Dockerfile
    container_name: redcode-dev-external-mock
    environment:
      EXTERNAL_MOCK_ADDR: ":19080"
    ports:
      - "19080:19080"
    networks:
      - dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:19080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 后端服务
  api:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    container_name: redcode-dev-api
    working_dir: /app
    command: ["cargo", "run", "--bin", "redcode-im-api"]
    ports:
      - "8010:8010"  # 仅 api 对外暴露，供调试访问
    volumes:
      - ../..:/app
      - cargo_target:/app/target
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
    environment:
      PORT: "8010"
      RUST_LOG: debug
      DATABASE_URL: postgres://postgres:123456@postgres:5432/redcode_im
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-20}
      DATABASE_MIN_CONNECTIONS: ${DATABASE_MIN_CONNECTIONS:-0}
      DATABASE_ACQUIRE_TIMEOUT_SECONDS: ${DATABASE_ACQUIRE_TIMEOUT_SECONDS:-30}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_CHANNEL_CAPACITY: ${METRICS_CHANNEL_CAPACITY:-8192}
      METRICS_FLUSH_BATCH_SIZE: ${METRICS_FLUSH_BATCH_SIZE:-1000}
      METRICS_FLUSH_INTERVAL_SECONDS: ${METRICS_FLUSH_INTERVAL_SECONDS:-5}
      METRICS_SAMPLE_RATE: ${METRICS_SAMPLE_RATE:-1.0}
      REDIS_SESSION_URL: redis://:123456@redis:6379/0
      REDIS_PUBSUB_URL: redis://:123456@redis:6379/0
      REDIS_CACHE_URL: redis://:123456@redis:6379/0
      EXTERNAL_MOCK_BASE_URL: http://external-mock:19080
      REDCODE_IM_S3_ENDPOINT: http://external-mock:19080
      REDCODE_IM_S3_PRESIGN_PUBLIC_ENDPOINT: http://127.0.0.1:19080
      REDCODE_IM_S3_REGION: us-east-1
      REDCODE_IM_S3_ACCESS_KEY: mock-access-key
      REDCODE_IM_S3_SECRET_KEY: mock-secret-key
      REDCODE_IM_S3_PRIVATE_BUCKET: mock-bucket
      REDCODE_IM_S3_PUBLIC_BUCKET: mock-bucket
      REDCODE_IM_S3_PUBLIC_BASE_URL: http://external-mock:19080/mock-bucket
      IPINFO_BASE_URL: http://external-mock:19080/ipinfo
      PUSH_FCM_BASE_URL: http://external-mock:19080/fcm
      PUSH_APNS_BASE_URL: http://external-mock:19080/apns
      WS_OUTBOUND_QUEUE_SIZE: ${WS_OUTBOUND_QUEUE_SIZE:-1024}
      SQLX_OFFLINE: "true"
      JWT_SECRET: dev-secret-change-me
      TZ: Asia/Shanghai
      CARGO_TARGET_DIR: /app/target
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      external-mock:
        condition: service_healthy
    networks:
      - dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

volumes:
  postgres_data:
    name: redcode_dev_postgres_data
  redis_data:
    name: redcode_dev_redis_data
  cargo_target:
    name: redcode_dev_cargo_target
  cargo_registry:
    name: redcode_dev_cargo_registry
  cargo_git:
    name: redcode_dev_cargo_git

networks:
  dev-network:
    name: redcode_dev_network
    driver: bridge
