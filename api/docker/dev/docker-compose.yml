# 本地开发环境 - 源码运行（容器内 cargo run）
# 用法: docker compose -f backend/docker/dev/docker-compose.yml up -d

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:17-alpine
    container_name: redcode-dev-postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: redcode_im
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      TZ: Asia/Shanghai
    networks:
      - dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis（session / pubsub / cache 三个逻辑入口共用）
  redis:
    image: redis:7-alpine
    container_name: redcode-dev-redis
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --port 6379
      --requirepass 123456
      --appendonly yes
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory 128mb
      --maxmemory-policy volatile-lru
    networks:
      - dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # 后端服务
  backend:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    container_name: redcode-dev-backend
    working_dir: /app
    command: ["cargo", "run", "--bin", "redcode-im-api"]
    ports:
      - "8010:8010"  # 仅 backend 对外暴露，供调试访问
    volumes:
      - ../..:/app
      - cargo_target:/app/target
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
    environment:
      PORT: "8010"
      RUST_LOG: debug
      DATABASE_URL: postgres://postgres:123456@postgres:5432/redcode_im
      REDIS_SESSION_URL: redis://:123456@redis:6379/0
      REDIS_PUBSUB_URL: redis://:123456@redis:6379/0
      REDIS_CACHE_URL: redis://:123456@redis:6379/0
      SQLX_OFFLINE: "true"
      JWT_SECRET: dev-secret-change-me
      TZ: Asia/Shanghai
      CARGO_TARGET_DIR: /app/target
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

volumes:
  postgres_data:
    name: redcode_dev_postgres_data
  redis_data:
    name: redcode_dev_redis_data
  cargo_target:
    name: redcode_dev_cargo_target
  cargo_registry:
    name: redcode_dev_cargo_registry
  cargo_git:
    name: redcode_dev_cargo_git

networks:
  dev-network:
    name: redcode_dev_network
    driver: bridge
