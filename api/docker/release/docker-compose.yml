# 本地 release 环境 - 镜像内构建并运行二进制
# 用法: docker compose -f backend/docker/release/docker-compose.yml up -d

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:17-alpine
    container_name: redcode-release-postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: redcode_im
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      TZ: Asia/Shanghai
    networks:
      - release-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis（session / pubsub / cache 三个逻辑入口共用）
  redis:
    image: redis:7-alpine
    container_name: redcode-release-redis
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --port 6379
      --requirepass 123456
      --appendonly yes
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory 128mb
      --maxmemory-policy volatile-lru
    networks:
      - release-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # 后端服务
  api:
    build:
      context: ../..
      dockerfile: docker/release/Dockerfile
    container_name: redcode-release-api
    ports:
      - "8010:8010"  # 仅 backend 对外暴露，供调试访问
    environment:
      PORT: "8010"
      RUST_LOG: debug
      DATABASE_URL: postgres://postgres:123456@postgres:5432/redcode_im
      REDIS_SESSION_URL: redis://:123456@redis:6379/0
      REDIS_PUBSUB_URL: redis://:123456@redis:6379/0
      REDIS_CACHE_URL: redis://:123456@redis:6379/0
      JWT_SECRET: dev-secret-change-me
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - release-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
    name: redcode_release_postgres_data
  redis_data:
    name: redcode_release_redis_data

networks:
  release-network:
    name: redcode_release_network
    driver: bridge
