 [package]
 name = "redcode-im-api"
 version = "0.1.0"
 edition = "2021"

 [dependencies]
 # Web 框架
 axum = { version = "0.8.6", features = ["ws", "json", "multipart"] }
 tokio = { version = "1.44", features = ["full"] }
 tower-http = { version = "0.6.6", features = ["cors", "trace", "fs"] }

 # 日志和追踪
 tracing = "0.1"
 tracing-appender = "0.2"
 tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

 # 序列化
 serde = { version = "1.0", features = ["derive"] }
 serde_json = "1.0"

 # 认证和加密
 jsonwebtoken = "9.3"
 bcrypt = "0.16"

 # 时间处理
 chrono = { version = "0.4", features = ["serde"] }
 time = { version = "0.3", features = ["formatting", "parsing"] }

 # ID 生成
 uuid = { version = "1.11", features = ["v4", "v7", "serde"] }

# 数据库
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "sqlite", "chrono", "uuid", "macros", "migrate", "bigdecimal", "json", "ipnetwork"], default-features = false }
bigdecimal = "0.4"
ipnetwork = "0.20"

 # 缓存
 redis = { version = "0.32.7", features = ["tokio-comp", "json", "cluster"] }

 # 环境变量
 dotenvy = "0.15"
 local-ip-address = "0.6"

 # 异步工具
 tokio-stream = "0.1"
 futures-util = "0.3"
 async-trait = "0.1"

 # 编码和加密
 base64 = "0.22"
 sha1 = "0.10"
 hmac = "0.12"
 hex = "0.4"
 md5 = "0.7"
 urlencoding = "2.1"
sha2 = "0.10"
aes-gcm = "0.10"
machine-uid = "0.3"

 # HTTP 客户端
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "http2"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-credential-types = "1"

 # Protocol Buffers
 prost = "0.14.1"
 prost-types = "0.14.1"
 bytes = "1.9"

 # 工具库
 lazy_static = "1.5"
 once_cell = "1.19"
 rand = "0.8"
regex = "1.11"
quick-xml = { version = "0.37", features = ["serialize"] }

 [build-dependencies]
 prost-build = "0.14.1"
 protoc-bin-vendored = "3.0"

[dev-dependencies]
# 集成测试：axum oneshot 进程内请求
tower = "0.5"
http-body-util = "0.1"
tokio-tungstenite = "0.28"
