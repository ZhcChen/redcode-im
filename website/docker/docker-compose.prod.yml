version: '3.8'

services:
  # Nuxt 网站生产环境
  website:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: redcode-website:latest
    container_name: redcode-website
    ports:
      - "8015:8015"
    environment:
      - TZ=Asia/Shanghai
      - NODE_ENV=production
    networks:
      - website-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8015"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "com.redcode.service=website"
      - "com.redcode.description=Nuxt网站生产环境"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

networks:
  website-network:
    driver: bridge
    name: redcode_website_network
    ipam:
      config:
        - subnet: 172.22.0.0/16

