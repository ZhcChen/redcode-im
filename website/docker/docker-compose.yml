version: '3.8'

services:
  # Nuxt 网站
  website:
    build:
      context: .
      dockerfile: Dockerfile
    image: redcode-website:latest
    container_name: redcode-website
    ports:
      - "8015:8015"
    environment:
      - TZ=Asia/Shanghai
    networks:
      - website-network
    restart: unless-stopped
    labels:
      - "com.redcode.service=website"
      - "com.redcode.description=Nuxt网站"

networks:
  website-network:
    driver: bridge
    name: redcode_website_network
    ipam:
      config:
        - subnet: 172.22.0.0/16


