version: '3.8'

services:
  # Nuxt 网站开发环境
  website:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: redcode-website-dev
    ports:
      - "8015:8015"
    volumes:
      - ../:/app
      - /app/node_modules
      - /app/.nuxt
    environment:
      - TZ=Asia/Shanghai
      - NODE_ENV=development
    networks:
      - website-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8015"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "com.redcode.service=website-dev"
      - "com.redcode.description=Nuxt网站开发环境"

networks:
  website-network:
    driver: bridge
    name: redcode_website_network
    ipam:
      config:
        - subnet: 172.22.0.0/16

