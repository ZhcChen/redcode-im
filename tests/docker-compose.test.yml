# api 集成测试依赖栈（Rust 原生轻量）
#
# 仅 pg + redis + external-mock，映射宿主端口供**本机** `cargo test --tests` 连接。
# 用法：
#   docker compose -f tests/docker-compose.test.yml up -d
#   cd api && DATABASE_URL=postgres://postgres:123456@localhost:5433/redcode_im \
#     REDIS_SESSION_URL=redis://:123456@localhost:6380/0 ... cargo test --tests -- --test-threads=1
# （通常由 `make api.test.integration` 封装环境变量）
services:
  postgres:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_DB: redcode_im
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      TZ: Asia/Shanghai
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.2.2-alpine
    command: ["redis-server", "--port", "6379", "--requirepass", "123456", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "-a", "123456", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  external-mock:
    image: golang:1.25
    working_dir: /workspace/tests/mocks/external
    volumes:
      - ./mocks/external:/workspace/tests/mocks/external
    command: ["go", "run", "./cmd/external-mock"]
    environment:
      EXTERNAL_MOCK_ADDR: ":19080"
    ports:
      - "19080:19080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:19080/healthz >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
