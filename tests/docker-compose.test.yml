x-postgres-resources: &postgres-resources
  cpus: "${POSTGRES_TEST_CPUS:-2.0}"
  mem_limit: "${POSTGRES_TEST_MEMORY:-2g}"
  memswap_limit: "${POSTGRES_TEST_MEMORY_SWAP:-2g}"

x-redis-resources: &redis-resources
  cpus: "${REDIS_TEST_CPUS:-1.0}"
  mem_limit: "${REDIS_TEST_MEMORY:-512m}"
  memswap_limit: "${REDIS_TEST_MEMORY_SWAP:-512m}"

x-external-mock-resources: &external-mock-resources
  cpus: "${EXTERNAL_MOCK_CPUS:-0.25}"
  mem_limit: "${EXTERNAL_MOCK_MEMORY:-128m}"
  memswap_limit: "${EXTERNAL_MOCK_MEMORY_SWAP:-128m}"

x-api-resources: &api-resources
  cpus: "${API_SERVICE_CPUS:-2.0}"
  mem_limit: "${API_SERVICE_MEMORY:-1g}"
  memswap_limit: "${API_SERVICE_MEMORY_SWAP:-1g}"

x-rust-test-resources: &rust-test-resources
  cpus: "${RUST_TEST_CPUS:-4.0}"
  mem_limit: "${RUST_TEST_MEMORY:-4g}"
  memswap_limit: "${RUST_TEST_MEMORY_SWAP:-4g}"

x-api-perf-resources: &api-perf-resources
  cpus: "${API_PERF_CPUS:-1.0}"
  mem_limit: "${API_PERF_MEMORY:-512m}"
  memswap_limit: "${API_PERF_MEMORY_SWAP:-512m}"

x-api-test-environment: &api-test-environment
  PORT: "8010"
  RUST_LOG: "${API_TEST_RUST_LOG:-warn}"
  SQLX_OFFLINE: "true"
  DATABASE_URL: postgres://postgres:123456@postgres:5432/redcode_im
  DATABASE_MAX_CONNECTIONS: "${DATABASE_MAX_CONNECTIONS:-20}"
  DATABASE_MIN_CONNECTIONS: "${DATABASE_MIN_CONNECTIONS:-0}"
  DATABASE_ACQUIRE_TIMEOUT_SECONDS: "${DATABASE_ACQUIRE_TIMEOUT_SECONDS:-30}"
  REDIS_SESSION_URL: redis://:123456@redis:6379/0
  REDIS_PUBSUB_URL: redis://:123456@redis:6379/0
  REDIS_CACHE_URL: redis://:123456@redis:6379/0
  JWT_SECRET: test-jwt-secret-change-me
  DATA_ENCRYPTION_KEY: test-data-encryption-key-change-me
  BCRYPT_COST: "${BCRYPT_COST:-12}"
  LOG_DB_ENABLED: "false"
  LOG_CONSOLE_ENABLED: "true"
  METRICS_ENABLED: "${METRICS_ENABLED:-true}"
  METRICS_CHANNEL_CAPACITY: "${METRICS_CHANNEL_CAPACITY:-8192}"
  METRICS_FLUSH_BATCH_SIZE: "${METRICS_FLUSH_BATCH_SIZE:-1000}"
  METRICS_FLUSH_INTERVAL_SECONDS: "${METRICS_FLUSH_INTERVAL_SECONDS:-5}"
  METRICS_SAMPLE_RATE: "${METRICS_SAMPLE_RATE:-1.0}"
  EXTERNAL_MOCK_BASE_URL: http://external-mock:19080
  REDCODE_IM_S3_ENDPOINT: http://external-mock:19080
  REDCODE_IM_S3_REGION: us-east-1
  REDCODE_IM_S3_ACCESS_KEY: mock-access-key
  REDCODE_IM_S3_SECRET_KEY: mock-secret-key
  REDCODE_IM_S3_PRIVATE_BUCKET: mock-bucket
  REDCODE_IM_S3_PUBLIC_BUCKET: mock-bucket
  REDCODE_IM_S3_PUBLIC_BASE_URL: http://external-mock:19080/mock-bucket
  IPINFO_BASE_URL: http://external-mock:19080/ipinfo
  PUSH_FCM_BASE_URL: http://external-mock:19080/fcm
  PUSH_APNS_BASE_URL: http://external-mock:19080/apns
  WS_OUTBOUND_QUEUE_SIZE: "${WS_OUTBOUND_QUEUE_SIZE:-1024}"
  CARGO_TARGET_DIR: /app/target
  CARGO_BUILD_JOBS: "${CARGO_BUILD_JOBS:-1}"
  TZ: Asia/Shanghai

services:
  postgres:
    image: postgres:17.6-alpine3.22
    <<: *postgres-resources
    environment:
      POSTGRES_DB: redcode_im
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.2.2-alpine
    <<: *redis-resources
    command: ["redis-server", "--port", "6379", "--requirepass", "123456", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "-a", "123456", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  external-mock:
    build:
      context: ./mocks/external
      dockerfile: Dockerfile
    <<: *external-mock-resources
    environment:
      EXTERNAL_MOCK_ADDR: ":19080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:19080/healthz >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  rust-tests:
    image: redcode-im-api-test-runner
    build:
      context: ../api
      dockerfile: docker/dev/Dockerfile
    <<: *rust-test-resources
    working_dir: /app
    volumes:
      - ../api:/app
      - cargo_target:/app/target
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
    environment:
      <<: *api-test-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      external-mock:
        condition: service_healthy
    command: ["cargo", "test", "--lib"]

  api:
    image: redcode-im-api-test-runner
    build:
      context: ../api
      dockerfile: docker/dev/Dockerfile
    <<: *api-resources
    working_dir: /app
    volumes:
      - ../api:/app
      - cargo_target:/app/target
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
    environment:
      <<: *api-test-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      external-mock:
        condition: service_healthy
    command: ["/app/target/debug/redcode-im-api"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/readyz"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 300s

  api-release-local:
    image: redcode-im-api-test-runner
    build:
      context: ../api
      dockerfile: docker/dev/Dockerfile
    <<: *api-resources
    working_dir: /app
    volumes:
      - ../api:/app
      - cargo_target:/app/target
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
    environment:
      <<: *api-test-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      external-mock:
        condition: service_healthy
    command: ["/app/target/release/redcode-im-api"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/readyz"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s

  api-perf:
    image: golang:1.25-alpine
    <<: *api-perf-resources
    working_dir: /work
    volumes:
      - ./perf:/work
      - ./perf/reports:/reports
    environment:
      API_BASE_URL: "${API_BASE_URL:-http://api:8010}"
      API_RUNTIME: "${API_RUNTIME:-debug}"
      PERF_SCENARIO: "${PERF_SCENARIO:-healthz}"
      PERF_DURATION_SECONDS: "${PERF_DURATION_SECONDS:-30}"
      PERF_WARMUP_SECONDS: "${PERF_WARMUP_SECONDS:-3}"
      PERF_CONCURRENCY: "${PERF_CONCURRENCY:-64}"
      PERF_REQUEST_INTERVAL_MS: "${PERF_REQUEST_INTERVAL_MS:-0}"
      PERF_TIMEOUT_MS: "${PERF_TIMEOUT_MS:-5000}"
      PERF_MAX_ERROR_RATE: "${PERF_MAX_ERROR_RATE:-0.01}"
      PERF_WS_CLIENTS: "${PERF_WS_CLIENTS:-32}"
      PERF_WS_MESSAGES: "${PERF_WS_MESSAGES:-30}"
      PERF_WS_LINGER_RST: "${PERF_WS_LINGER_RST:-true}"
      PERF_REPORT_DIR: /reports
      PERF_REPORT_NAME: "${PERF_REPORT_NAME:-}"
      PERF_RUN_ID: "${PERF_RUN_ID:-}"
      API_SERVICE_CPUS: "${API_SERVICE_CPUS:-2.0}"
      API_SERVICE_MEMORY: "${API_SERVICE_MEMORY:-1g}"
      POSTGRES_TEST_CPUS: "${POSTGRES_TEST_CPUS:-2.0}"
      POSTGRES_TEST_MEMORY: "${POSTGRES_TEST_MEMORY:-2g}"
      REDIS_TEST_CPUS: "${REDIS_TEST_CPUS:-1.0}"
      REDIS_TEST_MEMORY: "${REDIS_TEST_MEMORY:-512m}"
      DATABASE_MAX_CONNECTIONS: "${DATABASE_MAX_CONNECTIONS:-20}"
      DATABASE_MIN_CONNECTIONS: "${DATABASE_MIN_CONNECTIONS:-0}"
      DATABASE_ACQUIRE_TIMEOUT_SECONDS: "${DATABASE_ACQUIRE_TIMEOUT_SECONDS:-30}"
      BCRYPT_COST: "${BCRYPT_COST:-12}"
      METRICS_ENABLED: "${METRICS_ENABLED:-true}"
      METRICS_SAMPLE_RATE: "${METRICS_SAMPLE_RATE:-1.0}"
      METRICS_CHANNEL_CAPACITY: "${METRICS_CHANNEL_CAPACITY:-8192}"
      METRICS_FLUSH_BATCH_SIZE: "${METRICS_FLUSH_BATCH_SIZE:-1000}"
      WS_OUTBOUND_QUEUE_SIZE: "${WS_OUTBOUND_QUEUE_SIZE:-1024}"
    command: ["go", "run", "./api-load"]

  api-smoke:
    image: redcode-im-api-test-runner
    cpus: "${API_SMOKE_CPUS:-0.25}"
    mem_limit: "${API_SMOKE_MEMORY:-128m}"
    memswap_limit: "${API_SMOKE_MEMORY_SWAP:-128m}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        curl -fsS http://api:8010/healthz >/dev/null
        curl -fsS http://api:8010/readyz >/dev/null
        echo "api smoke ok"

volumes:
  cargo_target:
    name: redcode_test_cargo_target
  cargo_registry:
    name: redcode_test_cargo_registry
  cargo_git:
    name: redcode_test_cargo_git
