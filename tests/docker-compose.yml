# 重构后的最小测试栈：
# - 统一为 tests/run.sh 入口
# - 不依赖测试可视化 Dashboard

x-rust-service: &rust_service
  build:
    context: .
    dockerfile: rust-tests.Dockerfile
  working_dir: /workspace/backend
  volumes:
    - ../backend:/workspace/backend
    - cargo_target:/workspace/backend/target
    - cargo_registry:/usr/local/cargo/registry
    - cargo_git:/usr/local/cargo/git
  environment:
    TZ: Asia/Shanghai
    RUST_LOG: info
    CARGO_BUILD_JOBS: "1"
    CARGO_INCREMENTAL: "0"
    RUSTFLAGS: "-C debuginfo=0 -C codegen-units=1"
    PORT: "8010"
    DATABASE_URL: postgres://postgres:123456@postgres:5432/redcode_im
    REDIS_SESSION_URL: redis://:123456@redis-session:6381/0
    REDIS_CACHE_URL: redis://:123456@redis-cache:6383/0
    REDCODE_IM_MACHINE_ID: docker-test-machine-id
    JWT_SECRET: dev-secret-change-me
    PUSH_ENABLED: "false"
    ALLOW_INSECURE_ADMIN_BOOTSTRAP: "true"
    REDCODE_IM_STORAGE_DISABLE_NETWORK: "true"

services:
  postgres:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_DB: redcode_im
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis-session:
    image: redis:8.2.2-alpine
    command: ["redis-server", "--port", "6381", "--requirepass", "123456", "--appendonly", "yes"]
    volumes:
      - redis_session_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6381", "-a", "123456", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-cache:
    image: redis:8.2.2-alpine
    command: ["redis-server", "--port", "6383", "--requirepass", "123456"]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6383", "-a", "123456", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rust-tests:
    <<: *rust_service
    command: ["cargo", "test", "--lib"]
    depends_on:
      postgres:
        condition: service_healthy
      redis-session:
        condition: service_healthy
      redis-cache:
        condition: service_healthy

  backend:
    <<: *rust_service
    command: ["cargo", "run", "--bin", "redcode-im-backend"]
    depends_on:
      postgres:
        condition: service_healthy
      redis-session:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8010/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 80
      start_period: 300s

  go-tests:
    image: golang:1.25
    working_dir: /workspace/tests/go
    volumes:
      - ./go:/workspace/tests/go
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    environment:
      API_BASE_URL: http://backend:8010
    depends_on:
      backend:
        condition: service_healthy
    command: ["go", "test", "./...", "-v"]

volumes:
  postgres_data:
  redis_session_data:
  cargo_target:
  cargo_registry:
  cargo_git:
  go_mod_cache:
  go_build_cache:
