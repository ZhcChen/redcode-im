# backend contract 最小测试栈：
# - 统一为 tests/run.sh 入口
# - 不依赖测试可视化 Dashboard
# - API / PostgreSQL / Redis 放在同一个 Compose 网络内
# - PostgreSQL / Redis 不映射宿主机端口
# - 只启动一个 Redis，backend 的 session / pubsub / cache 三个逻辑入口都指向它

x-rust-service: &rust_service
  build:
    context: .
    dockerfile: rust-tests.Dockerfile
  working_dir: /workspace/backend
  volumes:
    - ../backend:/workspace/backend
    - cargo_target:/workspace/backend/target
    - cargo_registry:/usr/local/cargo/registry
    - cargo_git:/usr/local/cargo/git
  environment:
    TZ: Asia/Shanghai
    RUST_LOG: info
    CARGO_BUILD_JOBS: "1"
    CARGO_INCREMENTAL: "0"
    RUSTFLAGS: "-C debuginfo=0 -C codegen-units=1"
    PORT: "8010"
    DATABASE_URL: postgres://postgres:123456@postgres:5432/redcode_im
    REDIS_SESSION_URL: redis://:123456@redis:6379/0
    REDIS_PUBSUB_URL: redis://:123456@redis:6379/0
    REDIS_CACHE_URL: redis://:123456@redis:6379/0
    REDCODE_IM_MACHINE_ID: docker-test-machine-id
    JWT_SECRET: dev-secret-change-me
    PUSH_ENABLED: "true"
    # 测试栈对象存储必须走 external-mock，避免访问线上 B2。
    REDCODE_IM_STORAGE_DISABLE_NETWORK: "false"
    REDCODE_IM_STORAGE_SCHEME: "http"
    REDCODE_IM_B2_AUTHORIZE_ACCOUNT_URL: "http://external-mock:19080/b2api/v4/b2_authorize_account"
    REDCODE_IM_B2_ALLOW_MOCK_ENDPOINT: "true"
    REDCODE_IM_B2_ENDPOINT: "http://external-mock:19080"
    REDCODE_IM_B2_REGION: "us-east-005"
    REDCODE_IM_B2_KEY_ID: "mock-key-id"
    REDCODE_IM_B2_APPLICATION_KEY: "mock-application-key"
    REDCODE_IM_B2_PRIVATE_BUCKET: "mock-bucket"
    REDCODE_IM_B2_PUBLIC_BUCKET: "mock-bucket"
    REDCODE_IM_B2_PUBLIC_BASE_URL: "http://external-mock:19080/mock-bucket"
    IPINFO_BASE_URL: "http://external-mock:19080/ipinfo"
    PUSH_FCM_BASE_URL: "http://external-mock:19080/fcm"
services:
  external-mock:
    image: golang:1.25
    working_dir: /workspace/tests/mocks/external
    volumes:
      - ./mocks/external:/workspace/tests/mocks/external
    command: ["go", "run", "./cmd/external-mock"]
    environment:
      EXTERNAL_MOCK_ADDR: ":19080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:19080/healthz >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
  postgres:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_DB: redcode_im
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.2.2-alpine
    command: ["redis-server", "--port", "6379", "--requirepass", "123456", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "-a", "123456", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rust-tests:
    <<: *rust_service
    command: ["cargo", "test", "--lib"]
    depends_on:
      external-mock:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    <<: *rust_service
    command: ["cargo", "run", "--bin", "redcode-im-backend"]
    depends_on:
      external-mock:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8010/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 80
      start_period: 300s

  go-tests:
    image: golang:1.25
    working_dir: /workspace/tests/go
    volumes:
      - ..:/workspace
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    environment:
      API_BASE_URL: http://backend:8010
      EXTERNAL_MOCK_BASE_URL: http://external-mock:19080
    depends_on:
      external-mock:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: ["go", "test", "./...", "-v", "-p", "1"]

volumes:
  postgres_data:
  redis_data:
  cargo_target:
  cargo_registry:
  cargo_git:
  go_mod_cache:
  go_build_cache:
