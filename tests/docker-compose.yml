# 测试栈说明：
# - 仅使用 docker-compose（本机环境）
# - PostgreSQL / Redis 不映射到宿主端口（避免与其他项目冲突）
# - 通过同一 docker network 在容器内互通：backend / go-tests / rust-tests

# Rust 工具链容器（用于启动 backend 与运行 Rust 测试）
#
# 说明：
# - 不使用 backend/Dockerfile 做 release 构建（在本机资源较小的 Docker VM 上容易 OOM）
# - 使用 docker volume 存放 cargo registry/git/target，避免污染宿主 backend/target（且避免把 44G 的 target 打进 build context）
x-rust-service: &rust_service
  build:
    context: .
    dockerfile: rust-tests.Dockerfile
  working_dir: /workspace/backend
  volumes:
    - ../backend:/workspace/backend
    - cargo_target:/workspace/backend/target
    - cargo_registry:/usr/local/cargo/registry
    - cargo_git:/usr/local/cargo/git
  environment:
    TZ: Asia/Shanghai
    RUST_LOG: info
    CARGO_BUILD_JOBS: "1"
    CARGO_INCREMENTAL: "0"
    RUSTFLAGS: "-C debuginfo=0 -C codegen-units=1"
    PORT: "8010"
    DATABASE_URL: postgres://postgres:123456@postgres:5432/redcode_im
    REDIS_SESSION_URL: redis://:123456@redis-session:6381/0
    REDIS_CACHE_URL: redis://:123456@redis-cache:6383/0
    # 容器环境可能缺少 /etc/machine-id；单测/开发栈统一覆盖，避免依赖宿主机差异。
    REDCODE_IM_MACHINE_ID: docker-test-machine-id
    JWT_SECRET: dev-secret-change-me
    PUSH_ENABLED: "false"
    ALLOW_INSECURE_ADMIN_BOOTSTRAP: "true"

services:
  postgres:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_DB: redcode_im
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis-session:
    image: redis:8.2.2-alpine
    command: >
      redis-server
      --port 6381
      --requirepass 123456
      --appendonly yes
      --aof-use-rdb-preamble yes
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory 128mb
      --maxmemory-policy volatile-lru
      --timeout 300
      --tcp-keepalive 60
    volumes:
      - redis_session_data:/data
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6381", "-a", "123456", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-cache:
    image: redis:8.2.2-alpine
    command: >
      redis-server
      --port 6383
      --requirepass 123456
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save ""
      --timeout 300
      --tcp-keepalive 60
      --rdbcompression yes
      --active-defrag-threshold-lower 10
      --active-defrag-threshold-upper 100
      --active-defrag-cycle-min 25
      --active-defrag-cycle-max 75
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6383", "-a", "123456", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    <<: *rust_service
    # 仅暴露 Backend（可用于手工/移动端/桌面端联调）；PG/Redis 不暴露宿主端口，避免冲突。
    # 如宿主 8010 被占用，可通过 BACKEND_HOST_PORT 覆盖：BACKEND_HOST_PORT=18010 ./tests/run.sh
    ports:
      - "${BACKEND_HOST_PORT:-8010}:8010"
    command: ["cargo", "run", "--bin", "redcode-im-backend"]
    depends_on:
      postgres:
        condition: service_healthy
      redis-session:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8010/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s

  go-tests:
    image: golang:1.25
    working_dir: /workspace/tests/go
    volumes:
      - ./go:/workspace/tests/go
    environment:
      API_BASE_URL: http://backend:8010
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
    depends_on:
      backend:
        condition: service_healthy
    command: ["go", "test", "./...", "-v"]

  rust-tests:
    <<: *rust_service
    command: ["cargo", "test", "--lib"]

volumes:
  postgres_data:
  redis_session_data:
  cargo_target:
  cargo_registry:
  cargo_git:
