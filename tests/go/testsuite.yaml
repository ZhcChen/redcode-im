suites:
  - id: backend
    name: Backend 契约/集成测试（Go）
    kind: integration
    cases:
      - id: backend.all
        name: 全量（go test ./...）
        command: ["go", "test", "./...", "-v"]

      - id: backend.auth.flow
        name: 认证：注册/登录/me/刷新
        command: ["go", "test", "./backend/auth", "-run", "TestAuth_", "-v"]

      - id: backend.auth.sms
        name: 认证：短信登录（通用验证码）
        command: ["go", "test", "./backend/auth", "-run", "TestAuth_SMSLogin_", "-v"]

      - id: backend.auth.oauth
        name: 认证：第三方登录（缺少配置时应失败）
        command: ["go", "test", "./backend/auth", "-run", "TestAuth_OAuthLogin_", "-v"]

      - id: backend.auth.reset_password
        name: 认证：短信重置密码（通用验证码）
        command: ["go", "test", "./backend/auth", "-run", "TestAuth_ResetPassword_", "-v"]

      - id: backend.admin.smoke
        name: 管理后台：登录/me/dashboard
        command: ["go", "test", "./backend/admin", "-run", "TestAdmin_LoginMeAndDashboard", "-v"]

      - id: backend.admin.roles_permissions
        name: 管理后台：权限/角色/权限检查
        command: ["go", "test", "./backend/admin", "-run", "TestAdmin_PermissionsAndRoles", "-v"]

      - id: backend.admin.logs
        name: 管理后台：系统日志查询/统计
        command: ["go", "test", "./backend/admin", "-run", "TestAdmin_SystemLogs_", "-v"]

      - id: backend.admin.storage_providers
        name: 管理后台：存储提供商 CRUD
        command: ["go", "test", "./backend/admin", "-run", "TestAdmin_StorageProviders_", "-v"]

      - id: backend.admin.files
        name: 管理后台：文件管理（stats/list/delete）
        command: ["go", "test", "./backend/admin", "-run", "TestAdmin_FileManagement_", "-v"]

      - id: backend.admin.file_upload_audit
        name: 管理后台：文件内容审核任务（list/get/requeue）
        command: ["go", "test", "./backend/admin", "-run", "TestAdmin_FileUploadAuditTasks_", "-v"]

      - id: backend.admin.feedbacks
        name: 管理后台：反馈列表
        command: ["go", "test", "./backend/admin", "-run", "TestAdmin_Feedbacks_", "-v"]

      - id: backend.admin.reports
        name: 管理后台：举报列表
        command: ["go", "test", "./backend/admin", "-run", "TestAdmin_Reports_", "-v"]

      - id: backend.admin.chat_history
        name: 管理后台：聊天记录查询
        command: ["go", "test", "./backend/admin", "-run", "TestAdmin_ChatHistory_", "-v"]

      - id: backend.admin.push_ops
        name: 管理后台：Push 运维接口（push logs / job queue）
        command: ["go", "test", "./backend/admin", "-run", "TestAdmin_(PushLogs_|PushJobQueueStats)", "-v"]

      - id: backend.admin.push_settings
        name: 管理后台：Push 配置（开关/Provider/测试校验）
        command: ["go", "test", "./backend/admin", "-run", "TestAdmin_PushSettings_", "-v"]

      - id: backend.admin.ip_geolocation
        name: 管理后台：IP 地理位置开关
        command: ["go", "test", "./backend/admin", "-run", "TestAdmin_IpGeolocationEnabled_Toggle", "-v"]

      - id: backend.admin.monitoring
        name: 管理后台：节点监控 + 性能统计
        command: ["go", "test", "./backend/admin", "-run", "TestAdmin_NodesMonitor_AndPerformanceMetrics", "-v"]

      - id: backend.admin.users_list_status
        name: 管理后台：用户列表过滤 + 封禁状态
        command: ["go", "test", "./backend/admin", "-run", "TestAdmin_Users_ListFilterAndStatus_BanBlocksLogin", "-v"]

      - id: backend.admin.users_crud
        name: 管理后台：用户 CRUD（create/detail/update/delete）
        command: ["go", "test", "./backend/admin", "-run", "TestAdmin_Users_CreateDetailUpdateDelete", "-v"]

      - id: backend.admin.admin_users
        name: 管理后台：管理员账号管理（list/create/lock）
        command: ["go", "test", "./backend/admin", "-run", "TestAdmin_AdminUsers_ListCreateAndLock", "-v"]

      - id: backend.admin.user_account_limit
        name: 管理后台：账号校验规则（user-account-limit）
        command: ["go", "test", "./backend/admin", "-run", "TestAdmin_UserAccountLimit_", "-v"]

      - id: backend.admin.ipinfo_tokens
        name: 管理后台：ipinfo token 池管理
        command: ["go", "test", "./backend/admin", "-run", "TestAdmin_IpinfoTokens_CRUD", "-v"]

      - id: backend.admin.dashboard_extra
        name: 管理后台：dashboard 衍生统计（storage/emoji/statistics）
        command: ["go", "test", "./backend/admin", "-run", "TestAdmin_Dashboard_StorageEmojiAndStatistics", "-v"]

      - id: backend.reports.create
        name: 举报：用户端创建（含截图签名/commit）
        command: ["go", "test", "./backend/reports", "-run", "TestReports_", "-v"]

      - id: backend.admin.user_password_reset
        name: 管理后台：重置用户密码
        command: ["go", "test", "./backend/admin", "-run", "TestAdmin_ResetUserPassword", "-v"]

      - id: backend.rooms.add_member
        name: 群聊：添加成员
        command: ["go", "test", "./backend/rooms", "-run", "TestAddMembers_", "-v"]

      - id: backend.activity.logs
        name: 活动日志：heartbeat/login-history
        command: ["go", "test", "./backend/activity", "-run", "TestActivityLogs_", "-v"]

      - id: backend.rooms.join_leave
        name: 房间：加入/退出
        command: ["go", "test", "./backend/rooms", "-run", "TestRooms_JoinLeave_", "-v"]

      - id: backend.rooms.join_approval
        name: 房间：入群审批 + 私聊禁 join
        command: ["go", "test", "./backend/rooms", "-run", "TestRooms_(JoinGroup_RequiresApprovalWhenEnabled|Join_PrivateRoomForbiddenForNonMember)", "-v"]

      - id: backend.rooms.pin_notification
        name: 房间：置顶 + 通知设置
        command: ["go", "test", "./backend/rooms", "-run", "TestRooms_PinAndNotificationSettings", "-v"]

      - id: backend.rooms.avatar
        name: 房间头像：直传 + commit + 下载 URL
        command: ["go", "test", "./backend/rooms", "-run", "TestRooms_Avatar_", "-v"]

      - id: backend.rooms.detail_update
        name: 房间：详情/成员/更新权限
        command: ["go", "test", "./backend/rooms", "-run", "TestRooms_(DetailAndMembers|UpdateRoom)_", "-v"]

      - id: backend.rooms.management
        name: 房间：转让群主/解散/踢人
        command: ["go", "test", "./backend/rooms", "-run", "TestRooms_(TransferOwner|DissolveGroup|RemoveMember)_", "-v"]

      - id: backend.chats.list_delete
        name: 会话：列表/删除
        command: ["go", "test", "./backend/chats", "-run", "TestChats_", "-v"]

      - id: backend.messages.search
        name: 消息搜索：权限边界
        command: ["go", "test", "./backend/messages", "-run", "TestMessageSearch_", "-v"]

      - id: backend.messages.search_extras
        name: 消息搜索：建议 + 热门
        command: ["go", "test", "./backend/messages", "-run", "TestMessageSearch_SuggestionsAndTrending", "-v"]

      - id: backend.messages.reactions_http
        name: 消息反应：HTTP 增删查
        command: ["go", "test", "./backend/messages", "-run", "TestMessageReactions_HTTP_", "-v"]

      - id: backend.messages.edit_delete
        name: 消息：编辑/删除权限
        command: ["go", "test", "./backend/messages", "-run", "TestMessages_EditAndDelete_", "-v"]

      - id: backend.messages.read_unread
        name: 消息已读/未读：核心链路
        command: ["go", "test", "./backend/messages", "-run", "TestMessageReadAndUnreadCounts_", "-v"]

      - id: backend.messages.since
        name: 消息列表：since_id 补拉
        command: ["go", "test", "./backend/messages", "-run", "TestListMessages_SinceID_", "-v"]

      - id: backend.messages.permissions
        name: 消息：非成员权限（403）
        command: ["go", "test", "./backend/messages", "-run", "TestMessages_NonMember_", "-v"]

      - id: backend.messages.management
        name: 消息：置顶/清空/read_until/转发
        command: ["go", "test", "./backend/messages", "-run", "TestMessages_(PinAndUnpin|ClearRoomMessages|ReadUntil|Forward)_", "-v"]

      - id: backend.messages.attachments
        name: 消息：附件签名 + 下载 URL
        command: ["go", "test", "./backend/messages", "-run", "TestMessages_Attachments_", "-v"]

      - id: backend.group_management
        name: 群管理：设置 + 群规
        command: ["go", "test", "./backend/group_management", "-run", "TestGroupManagement_", "-v"]

      - id: backend.emoji_packs
        name: 贴纸：可用/添加/移除/下载 URL
        command: ["go", "test", "./backend/emoji_packs", "-run", "TestEmojiPacks_", "-v"]

      - id: backend.friends.flow
        name: 好友：申请/同意/私聊房间
        command: ["go", "test", "./backend/friends", "-run", "TestFriendRequest_", "-v"]

      - id: backend.friends.remark_delete
        name: 好友：备注/删除/拒绝
        command: ["go", "test", "./backend/friends", "-run", "TestFriends_", "-v"]

      - id: backend.system.upload_policy
        name: 上传策略：用户端 + 管理端回归
        command: ["go", "test", "./backend/system", "-run", "TestUploadPolicy_", "-v"]

      - id: backend.uploads.multipart
        name: 上传：分片会话（消息附件）
        command: ["go", "test", "./backend/uploads", "-run", "TestUploads_Multipart_", "-v"]

      - id: backend.settings.public
        name: 设置：公开接口
        command: ["go", "test", "./backend/settings", "-run", "TestSettings_Public", "-v"]

      - id: backend.settings.admin
        name: 设置：管理端更新
        command: ["go", "test", "./backend/settings", "-run", "TestSettings_Admin", "-v"]

      - id: backend.users.profile
        name: 用户：搜索/资料/密码/注销
        command: ["go", "test", "./backend/users", "-run", "TestUsers_", "-v"]

      - id: backend.users.avatar
        name: 用户：头像签名 + URL
        command: ["go", "test", "./backend/users", "-run", "TestUsers_Avatar_", "-v"]

      - id: backend.push.devices
        name: Push：设备注册/注销
        command: ["go", "test", "./backend/push", "-run", "TestPush_", "-v"]

      - id: backend.versions.flow
        name: 版本：整包 + 热更新
        command: ["go", "test", "./backend/versions", "-run", "TestVersions_", "-v"]

      - id: backend.ws.smoke
        name: WebSocket：回归（auth/join/push/边界）
        command: ["go", "test", "./backend/ws", "-run", "TestWebSocket_", "-v"]
