services:
  # PostgreSQL数据库
  postgres:
    image: postgres:17.6-alpine3.22
    container_name: redcode-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: redcode_im
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      TZ: Asia/Shanghai
    networks:
      - redcode-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.redcode.service=postgres"
      - "com.redcode.description=PostgreSQL数据库"
      - "com.redcode.priority=1"

  
  # Session专用Redis - 持久化模式
  redis-session:
    image: redis:8.2.2-alpine
    container_name: redcode-redis-session
    ports:
      - "6381:6381"
    volumes:
      - redis_session_data:/data
    command: |
      redis-server
      --port 6381
      --requirepass ${REDIS_SESSION_PASSWORD:-redis_session_password}
      --appendonly yes
      --aof-use-rdb-preamble yes
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory 128mb
      --maxmemory-policy volatile-lru
      --timeout 300
      --tcp-keepalive 60
    networks:
      - redcode-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6381", "-a", "${REDIS_SESSION_PASSWORD:-redis_session_password}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    environment:
      TZ: Asia/Shanghai
    labels:
      - "com.redcode.service=redis-session"
      - "com.redcode.description=Session专用Redis-持久化模式"
      - "com.redcode.priority=2"

  # Streams专用Redis - 消息分发模式
  redis-streams:
    image: redis:8.2.2-alpine
    container_name: redcode-redis-streams
    ports:
      - "6382:6382"
    command: |
      redis-server
      --port 6382
      --requirepass ${REDIS_STREAM_PASSWORD:-redis_stream_password}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --timeout 300
      --tcp-keepalive 60
    networks:
      - redcode-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6382", "-a", "${REDIS_STREAM_PASSWORD:-redis_stream_password}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    environment:
      TZ: Asia/Shanghai
    labels:
      - "com.redcode.service=redis-streams"
      - "com.redcode.description=Streams专用Redis-消息分发模式"
      - "com.redcode.priority=2"

  # Cache专用Redis - 纯缓存模式
  redis-cache:
    image: redis:8.2.2-alpine
    container_name: redcode-redis-cache
    ports:
      - "6383:6383"
    command: |
      redis-server
      --port 6383
      --requirepass ${REDIS_CACHE_PASSWORD:-redis_cache_password}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save ""
      --timeout 300
      --tcp-keepalive 60
      --rdbcompression yes
      --active-defrag-threshold-lower 10
      --active-defrag-threshold-upper 100
      --active-defrag-cycle-min 25
      --active-defrag-cycle-max 75
    networks:
      - redcode-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6383", "-a", "${REDIS_CACHE_PASSWORD:-redis_cache_password}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    environment:
      TZ: Asia/Shanghai
    labels:
      - "com.redcode.service=redis-cache"
      - "com.redcode.description=Cache专用Redis-纯缓存模式"
      - "com.redcode.priority=3"

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: redcode-backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - /app/target  # 排除target目录
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/redcode_im
      - REDIS_SESSION_URL=redis://:${REDIS_SESSION_PASSWORD:-redis_session_password}@redis-session:6381
      - REDIS_STREAM_URL=redis://:${REDIS_STREAM_PASSWORD:-redis_stream_password}@redis-streams:6382
      - REDIS_CACHE_URL=redis://:${REDIS_CACHE_PASSWORD:-redis_cache_password}@redis-cache:6383
      - REDIS_SESSION_PASSWORD=${REDIS_SESSION_PASSWORD:-redis_session_password}
      - REDIS_STREAM_PASSWORD=${REDIS_STREAM_PASSWORD:-redis_stream_password}
      - REDIS_CACHE_PASSWORD=${REDIS_CACHE_PASSWORD:-redis_cache_password}
      - PORT=8080
      - JWT_SECRET=redcode-im-super-secret-jwt-key-change-this-in-production
      - RUST_LOG=info
      - TZ=Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis-session:
        condition: service_healthy
      redis-streams:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - redcode-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "com.redcode.service=backend"
      - "com.redcode.description=Rust后端服务"
      - "com.redcode.priority=1"

  # Redis命令行管理工具 (可选)
  redis-cli:
    image: redis:8.2.2-alpine
    container_name: redcode-redis-cli
    profiles:
      - tools
    command: sleep infinity
    networks:
      - redcode-network
    environment:
      TZ: Asia/Shanghai
    labels:
      - "com.redcode.service=redis-cli"
      - "com.redcode.description=Redis命令行管理工具"

  # PostgreSQL管理工具 (可选)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: redcode-pgadmin
    profiles:
      - tools
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@redcode.im
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - redcode-network
    depends_on:
      - postgres
    labels:
      - "com.redcode.service=pgadmin"
      - "com.redcode.description=PostgreSQL管理界面"

volumes:
  postgres_data:
    driver: local
    name: redcode_postgres_data
  redis_session_data:
    driver: local
    name: redcode_redis_session_data
  pgadmin_data:
    driver: local
    name: redcode_pgadmin_data

networks:
  redcode-network:
    driver: bridge
    name: redcode_network
    ipam:
      config:
        - subnet: 172.20.0.0/16