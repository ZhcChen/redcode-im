[package]
name = "redcode-e2ee-core"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
openmls = { version = "=0.8.1", features = ["js"] }
openmls_basic_credential = "=0.5.0"
openmls_memory_storage = "=0.5.0"
openmls_rust_crypto = "=0.5.1"
openmls_traits = "=0.5.0"
thiserror = "2.0"

[dev-dependencies]
openmls_memory_storage = { version = "=0.5.0", features = ["test-utils"] }
wasm-bindgen-test = "=0.3.76"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.17", features = ["js"] }
wasm-bindgen = "0.2.126"
